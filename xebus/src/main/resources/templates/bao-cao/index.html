<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Báo cáo thống kê</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
    <style>
        body { background-color: #f0f2f5; }
        .card { border: none; border-radius: 15px; transition: transform 0.3s; }
        .card:hover { transform: translateY(-5px); }
        .icon-box { font-size: 2rem; opacity: 0.8; }
        .card-title { color: #6c757d; font-size: 0.9rem; font-weight: 600; text-transform: uppercase; }
        .card-number { font-size: 1.8rem; font-weight: 700; margin-bottom: 0; }
        /* Màu sắc cho từng loại card */
        .card-ve { background: #e3f2fd; color: #0d47a1; }
        .card-doanhthu { background: #e8f5e9; color: #1b5e20; }
        .card-chuyen { background: #fff3e0; color: #e65100; }
    </style>
</head>
<body>

<div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold"><i class="fa-solid fa-chart-line text-primary"></i> Báo cáo thống kê</h2>
        <a href="/" class="btn btn-outline-secondary"><i class="fa-solid fa-house"></i> Trang chủ</a>
    </div>

    <div class="row">
        <div class="col-md-4 mb-4">
            <div class="card card-ve shadow-sm p-4 h-100">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <h5 class="card-title">Tổng số vé</h5>
                        <p class="card-number" th:text="${tongVe} + ' vé'">0</p>
                    </div>
                    <div class="icon-box"><i class="fa-solid fa-ticket-simple"></i></div>
                </div>
            </div>
        </div>

        <div class="col-md-4 mb-4">
            <div class="card card-doanhthu shadow-sm p-4 h-100">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <h5 class="card-title">Tổng doanh thu</h5>
                        <p class="card-number" th:text="${#numbers.formatDecimal(doanhThu, 0, 'COMMA', 0, 'POINT')} + ' VNĐ'">0</p>
                    </div>
                    <div class="icon-box"><i class="fa-solid fa-money-bill-wave"></i></div>
                </div>
            </div>
        </div>

        <div class="col-md-4 mb-4">
            <div class="card card-chuyen shadow-sm p-4 h-100">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <h5 class="card-title">Chuyến hoạt động</h5>
                        <p class="card-number" th:text="${tongChuyen} + ' chuyến'">0</p>
                    </div>
                    <div class="icon-box"><i class="fa-solid fa-bus"></i></div>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
