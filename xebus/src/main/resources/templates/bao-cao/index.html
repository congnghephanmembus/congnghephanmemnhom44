<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Báo cáo thống kê</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
</head>

<body>

<div class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <h2 class="mb-0">
            Báo cáo thống kê
        </h2>

        <a href="/"
           class="btn btn-secondary">

            Trang chủ

        </a>

    </div>

    <div class="row">

        <!-- TỔNG SỐ VÉ -->
        <div class="col-md-4 mb-3">

            <div class="card shadow-sm h-100">

                <div class="card-body">

                    <h5 class="card-title">
                        Tổng số vé đã bán
                    </h5>

                    <h3 th:text="${tongVe} + ' vé'">
                        0 vé
                    </h3>

                </div>

            </div>

        </div>

        <!-- DOANH THU -->
        <div class="col-md-4 mb-3">

            <div class="card shadow-sm h-100">

                <div class="card-body">

                    <h5 class="card-title">
                        Tổng doanh thu
                    </h5>

                    <h3 th:text="${doanhThu} + ' VNĐ'">
                        0 VNĐ
                    </h3>

                </div>

            </div>

        </div>

        <!-- CHUYẾN XE -->
        <div class="col-md-4 mb-3">

            <div class="card shadow-sm h-100">

                <div class="card-body">

                    <h5 class="card-title">
                        Số chuyến hoạt động
                    </h5>

                    <h3 th:text="${tongChuyen} + ' chuyến'">
                        0 chuyến
                    </h3>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
