<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Thông tin thanh toán</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
    <style>
        body { background-color: #f8f9fa; }
        .form-card { border-radius: 15px; border: none; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .form-label { font-weight: 600; color: #34495e; }
    </style>
</head>
<body>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card form-card p-4">
                <h3 class="mb-4 text-center text-primary">
                    <i class="fa fa-wallet"></i> Ghi nhận thanh toán
                </h3>

                <form th:action="@{/thanh-toan/luu}" th:object="${thanhToan}" method="post">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label"><i class="fa fa-barcode"></i> Mã thanh toán</label>
                            <input type="text" th:field="*{maThanhToan}" class="form-control" placeholder="Ví dụ: TT001" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label"><i class="fa fa-ticket-alt"></i> Mã vé</label>
                            <input type="text" th:field="*{maVe}" class="form-control" placeholder="VE..." required>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label"><i class="fa fa-calendar-alt"></i> Ngày thanh toán</label>
                            <input type="datetime-local" th:field="*{ngayThanhToan}" class="form-control" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label"><i class="fa fa-credit-card"></i> Phương thức</label>
                            <select th:field="*{phuongThuc}" class="form-select">
                                <option value="Tiền mặt">Tiền mặt</option>
                                <option value="Chuyển khoản">Chuyển khoản</option>
                                <option value="Thẻ tín dụng">Thẻ tín dụng</option>
                            </select>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label"><i class="fa fa-money-bill-wave"></i> Số tiền (VNĐ)</label>
                        <div class="input-group">
                            <input type="number" step="1000" th:field="*{soTien}" class="form-control" placeholder="0" required>
                            <span class="input-group-text">VNĐ</span>
                        </div>
                    </div>

                    <hr class="my-3">

                    <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                        <a href="/thanh-toan" class="btn btn-outline-secondary px-4">
                            <i class="fa fa-arrow-left"></i> Quay lại
                        </a>
                        <button type="submit" class="btn btn-primary px-4">
                            <i class="fa fa-save"></i> Lưu thanh toán
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

</body>
</html>
