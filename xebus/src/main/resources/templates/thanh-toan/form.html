<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Form thanh toán</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
</head>
<body>

<div class="container mt-4">

    <h2>Thông tin thanh toán</h2>

    <form th:action="@{/thanh-toan/luu}" th:object="${thanhToan}" method="post">

        <div class="mb-3">
            <label class="form-label">Mã thanh toán</label>
            <input type="text" th:field="*{maThanhToan}" class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Mã vé</label>
            <input type="text" th:field="*{maVe}" class="form-control">
        </div>

        <div class="mb-3">
            <label class="form-label">Ngày thanh toán</label>
            <input type="datetime-local" th:field="*{ngayThanhToan}" class="form-control">
        </div>

        <div class="mb-3">
            <label class="form-label">Phương thức</label>
            <input type="text" th:field="*{phuongThuc}" class="form-control">
        </div>

        <div class="mb-3">
            <label class="form-label">Số tiền</label>
            <input type="number" step="0.01" th:field="*{soTien}" class="form-control">
        </div>

        <button type="submit" class="btn btn-primary">Lưu</button>
        <a href="/thanh-toan" class="btn btn-secondary">Quay lại</a>

    </form>

</div>

</body>
</html>
