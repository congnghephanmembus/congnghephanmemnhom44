<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Cập nhật nhân viên</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>

    <style>
        body{
            background:#f4f7f6;
        }

        .card{
            border:none;
            border-radius:15px;
            box-shadow:0 10px 25px rgba(0,0,0,.1);
        }
    </style>
</head>

<body>

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-8">

            <div class="card p-4">

                <h3 class="text-center text-primary mb-4">
                    <i class="fa-solid fa-user-tie"></i>
                    Thông tin nhân viên
                </h3>

                <form
                        hx-post="/nhan-vien/luu"
                        hx-target="#main-display"
                        hx-swap="innerHTML"
                        th:object="${nhanVien}">

                    <!-- CSRF Token -->
                    <input type="hidden"
                           th:name="${_csrf.parameterName}"
                           th:value="${_csrf.token}" />

                    <!-- Mã nhân viên - READONLY -->
                    <div class="form-floating mb-3">
                        <input
                                type="text"
                                class="form-control"
                                id="maNV"
                                name="maNV"
                                placeholder="Mã nhân viên"
                                th:value="${nhanVien.maNV}"
                                readonly
                                required>
                        <label for="maNV">Mã nhân viên</label>
                    </div>

                    <!-- Họ tên -->
                    <div class="form-floating mb-3">
                        <input
                                type="text"
                                class="form-control"
                                id="hoTen"
                                name="hoTen"
                                placeholder="Họ tên"
                                th:value="${nhanVien.hoTen}"
                                required>
                        <label for="hoTen">Họ tên</label>
                    </div>

                    <!-- CCCD -->
                    <div class="form-floating mb-3">
                        <input
                                type="text"
                                class="form-control"
                                id="cccd"
                                name="cccd"
                                placeholder="CCCD"
                                th:value="${nhanVien.cccd}">
                        <label for="cccd">CCCD</label>
                    </div>

                    <!-- Ngày sinh -->
                    <div class="form-floating mb-3">
                        <input
                                type="date"
                                class="form-control"
                                id="ngaySinh"
                                name="ngaySinh"
                                placeholder="Ngày sinh"
                                th:value="${#temporals.format(nhanVien.ngaySinh, 'yyyy-MM-dd')}">
                        <label for="ngaySinh">Ngày sinh</label>
                    </div>

                    <!-- Giới tính -->
                    <div class="form-floating mb-3">
                        <select
                                class="form-select"
                                id="gioiTinh"
                                name="gioiTinh">
                            <option value="Nam" th:selected="${nhanVien.gioiTinh == 'Nam'}">Nam</option>
                            <option value="Nữ" th:selected="${nhanVien.gioiTinh == 'Nữ'}">Nữ</option>
                        </select>
                        <label for="gioiTinh">Giới tính</label>
                    </div>

                    <!-- Số điện thoại -->
                    <div class="form-floating mb-3">
                        <input
                                type="text"
                                class="form-control"
                                id="soDienThoai"
                                name="soDienThoai"
                                placeholder="Số điện thoại"
                                th:value="${nhanVien.soDienThoai}">
                        <label for="soDienThoai">Số điện thoại</label>
                    </div>

                    <!-- Email -->
                    <div class="form-floating mb-3">
                        <input
                                type="email"
                                class="form-control"
                                id="email"
                                name="email"
                                placeholder="Email"
                                th:value="${nhanVien.email}">
                        <label for="email">Email</label>
                    </div>

                    <!-- Chức vụ -->
                    <div class="form-floating mb-3">
                        <select
                                class="form-select"
                                id="chucVu"
                                name="chucVu">
                            <option value="Quản lý" th:selected="${nhanVien.chucVu == 'Quản lý'}">Quản lý</option>
                            <option value="Nhân viên bán vé" th:selected="${nhanVien.chucVu == 'Nhân viên bán vé'}">Nhân viên bán vé</option>
                            <option value="Tài xế" th:selected="${nhanVien.chucVu == 'Tài xế'}">Tài xế</option>
                        </select>
                        <label for="chucVu">Chức vụ</label>
                    </div>

                    <!-- Lương -->
                    <div class="form-floating mb-4">
                        <input
                                type="number"
                                step="1000"
                                class="form-control"
                                id="luong"
                                name="luong"
                                placeholder="Lương"
                                th:value="${nhanVien.luong}">
                        <label for="luong">Lương (VNĐ)</label>
                    </div>

                    <!-- Button -->
                    <div class="d-flex justify-content-end gap-2">
                        <a
                                hx-get="/nhan-vien"
                                hx-target="#main-display"
                                hx-swap="innerHTML"
                                class="btn btn-outline-secondary">
                            Huỷ
                        </a>
                        <button type="submit" class="btn btn-primary">
                            <i class="fa-solid fa-save"></i>
                            Lưu
                        </button>
                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

</body>
</html>
