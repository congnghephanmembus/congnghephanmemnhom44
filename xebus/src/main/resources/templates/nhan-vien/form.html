<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Form nhân viên</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
</head>
<body>

<div class="container mt-4">

    <h2>Thông tin nhân viên</h2>

    <form th:action="@{/nhanvien/luu}" 
          th:object="${nhanVien}" 
          method="post">

        <div class="mb-3">
            <label class="form-label">Mã NV</label>
            <input type="text" th:field="*{maNV}" class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Họ tên</label>
            <input type="text" th:field="*{hoTen}" class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Ngày sinh</label>
            <input type="date" th:field="*{ngaySinh}" class="form-control">
        </div>

        <div class="mb-3">
            <label class="form-label">Giới tính</label>
            <input type="text" th:field="*{gioiTinh}" class="form-control">
        </div>

        <div class="mb-3">
            <label class="form-label">Số điện thoại</label>
            <input type="text" th:field="*{soDienThoai}" class="form-control">
        </div>

        <div class="mb-3">
            <label class="form-label">Địa chỉ</label>
            <input type="text" th:field="*{diaChi}" class="form-control">
        </div>

        <div class="mb-3">
            <label class="form-label">Chức vụ</label>
            <input type="text" th:field="*{chucVu}" class="form-control">
        </div>

        <div class="mb-3">
            <label class="form-label">Lương</label>
            <input type="number" step="0.01"
                   th:field="*{luong}"
                   class="form-control">
        </div>

        <div class="mb-3">
            <label class="form-label">Trạng thái</label>
            <input type="text"
                   th:field="*{trangThai}"
                   class="form-control">
        </div>

        <button type="submit" class="btn btn-primary">Lưu</button>
        <a href="/nhanvien" class="btn btn-secondary">Quay lại</a>

    </form>

</div>

</body>
</html>
