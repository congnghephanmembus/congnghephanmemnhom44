<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Thông tin nhân viên</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
    <style>
        body { background-color: #f8f9fa; }
        .form-card { border-radius: 15px; border: none; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .form-label { font-weight: 600; color: #34495e; }
        .section-title { border-bottom: 2px solid #e9ecef; padding-bottom: 10px; margin-bottom: 20px; color: #2c3e50; }
    </style>
</head>
<body>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-lg-10">
            <div class="card form-card p-4">
                <h3 class="text-center text-primary mb-4"><i class="fa fa-user-edit"></i> Thông tin nhân viên</h3>
                
                <form th:action="@{/nhan-vien/luu}" th:object="${nhanVien}" method="post">
                    
                    <h5 class="section-title"><i class="fa fa-info-circle"></i> Thông tin định danh</h5>
                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Mã nhân viên</label>
                            <input type="text" th:field="*{maNV}" class="form-control" placeholder="NV001" required>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Họ tên</label>
                            <input type="text" th:field="*{hoTen}" class="form-control" required>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">CCCD</label>
                            <input type="text" th:field="*{cccd}" class="form-control">
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Ngày sinh</label>
                            <input type="date" th:field="*{ngaySinh}" class="form-control">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Giới tính</label>
                            <select th:field="*{gioiTinh}" class="form-select">
                                <option value="Nam">Nam</option>
                                <option value="Nữ">Nữ</option>
                            </select>
                        </div>
                    </div>

                    <h5 class="section-title mt-3"><i class="fa fa-briefcase"></i> Thông tin công việc</h5>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Số điện thoại</label>
                            <input type="text" th:field="*{soDienThoai}" class="form-control">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" th:field="*{email}" class="form-control">
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Chức vụ</label>
                            <select th:field="*{chucVu}" class="form-select">
                                <option value="Quản lý">Quản lý</option>
                                <option value="Nhân viên bán vé">Nhân viên bán vé</option>
                                <option value="Tài xế">Tài xế</option>
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Lương (VNĐ)</label>
                            <input type="number" step="1000" th:field="*{luong}" class="form-control">
                        </div>
                    </div>

                    <hr class="my-4">
                    <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                        <a href="/nhan-vien" class="btn btn-outline-secondary px-4">Quay lại</a>
                        <button type="submit" class="btn btn-primary px-4">Lưu thông tin</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

</body>
</html>
