<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Danh sách nhân viên</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
</head>
<body>

<div class="container mt-4">

    <h2 class="mb-3">Danh sách nhân viên</h2>

    <a href="/" class="btn btn-secondary mb-3">Trang chủ</a>
    
    <!-- Nút thêm: Manager + Admin -->
    <a sec:authorize="hasAnyRole('ROLE_QuanLy', 'ROLE_QuanTriVien')"
       href="/nhan-vien/them" class="btn btn-success mb-3">+ Thêm nhân viên</a>

    <table class="table table-bordered table-hover">
        <thead class="table-dark">
            <tr>
                <th>Mã NV</th>
                <th>Tên nhân viên</th>
                <th>CCCD</th>
                <th>Chức vụ</th>
                <th>Số điện thoại</th>
                <th>Hành động</th>
            </tr>
        </thead>

        <tbody>
            <tr th:each="nv : ${danhSach}">
                <td th:text="${nv.maNV}"></td>
                <td th:text="${nv.hoTen}"></td>
                <td th:text="${nv.cccd}"></td>
                <td th:text="${nv.chucVu}"></td>
                <td th:text="${nv.soDienThoai}"></td>

                <td>
                    <!-- Nút sửa: Manager + Admin -->
                    <a sec:authorize="hasAnyRole('ROLE_QuanLy', 'ROLE_QuanTriVien')"
                       th:href="@{/nhan-vien/sua/{ma}(ma=${nv.maNV})}"
                       class="btn btn-warning btn-sm">
                        Sửa
                    </a>

                    <!-- Nút xóa: Admin only -->
                    <a sec:authorize="hasRole('ROLE_QuanTriVien')"
                       th:href="@{/nhan-vien/xoa/{ma}(ma=${nv.maNV})}"
                       class="btn btn-danger btn-sm"
                       onclick="return confirm('Xác nhận xoá nhân viên này?')">
                        Xoá
                    </a>
                </td>
            </tr>
        </tbody>
    </table>

</div>

</body>
</html>
