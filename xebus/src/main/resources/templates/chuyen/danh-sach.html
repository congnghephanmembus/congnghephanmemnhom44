<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <title>Danh sách chuyến xe</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
</head>

<body>

<div class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-3">

        <h2>Danh sách chuyến xe</h2>

        <a href="/" class="btn btn-secondary">
            Trang chủ
        </a>

    </div>

    <!-- Manager + Admin -->
    <a sec:authorize="hasAnyRole('ROLE_QuanLy', 'ROLE_QuanTriVien')"
       href="/chuyen/them"
       class="btn btn-success mb-3">

        + Thêm chuyến xe mới

    </a>

    <table class="table table-bordered table-hover align-middle">

        <thead class="table-dark">

        <tr>
            <th>Mã chuyến</th>
            <th>Mã tuyến</th>
            <th>Mã xe</th>
            <th>Giờ khởi hành</th>
            <th>Giờ đến dự kiến</th>
            <th>Trạng thái</th>
            <th width="260">Hành động</th>
        </tr>

        </thead>

        <tbody>

        <tr th:each="c : ${danhSach}">

            <td th:text="${c.maChuyen}"></td>

            <td th:text="${c.maTuyen}"></td>

            <td th:text="${c.maXe}"></td>

            <td th:text="${c.gioKhoiHanh}"></td>

            <td th:text="${c.gioDenDuKien}"></td>

            <td th:text="${c.trangThaiChuyen}"></td>

            <td>

                <!-- Xem chi tiết -->
                <a th:href="@{/chuyen/chi-tiet/{ma}(ma=${c.maChuyen})}"
                   class="btn btn-info btn-sm">

                    Chi tiết

                </a>

                <!-- Manager + Admin -->
                <a sec:authorize="hasAnyRole('ROLE_QuanLy', 'ROLE_QuanTriVien')"
                   th:href="@{/chuyen/sua/{ma}(ma=${c.maChuyen})}"
                   class="btn btn-warning btn-sm">

                    Sửa

                </a>

                <!-- Manager + Admin được xóa -->
                <a sec:authorize="hasAnyRole('ROLE_QuanLy', 'ROLE_QuanTriVien')"
                   th:href="@{/chuyen/xoa/{ma}(ma=${c.maChuyen})}"
                   class="btn btn-danger btn-sm"
                   onclick="return confirm('Xác nhận xoá chuyến này?')">

                    Xoá

                </a>

            </td>

        </tr>

        </tbody>

    </table>

</div>

</body>
</html>
