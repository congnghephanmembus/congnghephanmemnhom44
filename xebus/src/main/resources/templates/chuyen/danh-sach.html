<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Danh sách chuyến xe</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
</head>
<body>

<div class="container mt-4">

    <h2 class="mb-3">Danh sách chuyến xe</h2>

    <a href="/" class="btn btn-secondary mb-3">Trang chủ</a>
    <a href="/chuyen/them" class="btn btn-success mb-3">+ Thêm chuyến mới</a>

    <table class="table table-bordered table-hover">
        <thead class="table-dark">
        <tr>
            <th>Mã chuyến</th>
            <th>Mã tuyến</th>
            <th>Mã xe</th>
            <th>Mã lịch</th>
            <th>Giờ khởi hành</th>
            <th>Giờ đến dự kiến</th>
            <th>Trạng thái</th>
            <th>Hành động</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="c : ${danhSach}">
            <td th:text="${c.maChuyen}"></td>
            <td th:text="${c.maTuyen}"></td>
            <td th:text="${c.maXe}"></td>
            <td th:text="${c.maLich}"></td>
            <td th:text="${c.gioKhoiHanh}"></td>
            <td th:text="${c.gioDenDuKien}"></td>
            <td th:text="${c.trangThaiChuyen}"></td>

            <td>
                <a th:href="@{/chuyen/sua/{ma}(ma=${c.maChuyen})}"
                   class="btn btn-warning btn-sm">
                    Sửa
                </a>

                <a th:href="@{/chuyen/xoa/{ma}(ma=${c.maChuyen})}"
                   class="btn btn-danger btn-sm"
                   onclick="return confirm('Xác nhận xoá chuyến này?')">
                    Xoá
                </a>
            </td>
        </tr>
        </tbody>
    </table>

</div>

</body>
</html>
