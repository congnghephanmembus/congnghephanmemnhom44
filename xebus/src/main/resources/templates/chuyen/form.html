<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Cập nhật chuyến xe</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>

    <style>
        body{
            background:#f4f7f6;
        }

        .card{
            border:none;
            border-radius:15px;
            box-shadow:0 10px 25px rgba(0,0,0,.1);
        }
    </style>
</head>

<body>

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-7">

            <div class="card p-4">

                <h3 class="text-center text-primary mb-4">
                    <i class="fa-solid fa-bus"></i>
                    Thông tin chuyến xe
                </h3>

                <form
                        hx-post="/chuyen/luu"
                        hx-target="#main-display"
                        hx-swap="innerHTML"
                        th:object="${chuyenXe}">

                    <!-- CSRF Token -->
                    <input type="hidden"
                           th:name="${_csrf.parameterName}"
                           th:value="${_csrf.token}" />

                    <!-- Mã chuyến - READONLY (không cho sửa) -->
                    <div class="form-floating mb-3">
                        <input
                                class="form-control"
                                id="maChuyen"
                                placeholder="Mã chuyến"
                                th:field="*{maChuyen}"
                                readonly
                                required>
                        <label for="maChuyen">Mã chuyến</label>
                    </div>

                    <!-- Mã tuyến - DROPDOWN -->
                    <div class="col-md-6">
                        <div class="form-floating mb-3">
                            <select
                                    class="form-select"
                                    id="maTuyen"
                                    th:field="*{maTuyen}">
                                <option value="">-- Chọn tuyến --</option>
                                <option th:each="t : ${danhSachTuyen}"
                                        th:value="${t.maTuyen}"
                                        th:text="${t.maTuyen + ' - ' + t.tenTuyen}">
                                </option>
                            </select>
                            <label for="maTuyen">Mã tuyến</label>
                        </div>
                    </div>

                    <!-- Mã xe - DROPDOWN -->
                    <div class="col-md-6">
                        <div class="form-floating mb-3">
                            <select
                                    class="form-select"
                                    id="maXe"
                                    th:field="*{maXe}">
                                <option value="">-- Chọn xe --</option>
                                <option th:each="x : ${danhSachXe}"
                                        th:value="${x.maXe}"
                                        th:text="${x.maXe + ' - ' + x.bienSo}">
                                </option>
                            </select>
                            <label for="maXe">Mã xe</label>
                        </div>
                    </div>

                    <!-- Mã lịch - DROPDOWN -->
                    <div class="form-floating mb-3">
                        <select
                                class="form-select"
                                id="maLich"
                                th:field="*{maLich}">
                            <option value="">-- Chọn lịch --</option>
                            <option th:each="l : ${danhSachLich}"
                                    th:value="${l.maLich}"
                                    th:text="${l.maLich + ' - ' + l.gioBatDau + ' → ' + l.gioKetThuc}">
                            </option>
                        </select>
                        <label for="maLich">Mã lịch</label>
                    </div>

                    <!-- Thời gian -->
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Giờ khởi hành</label>
                            <input
                                    type="datetime-local"
                                    class="form-control"
                                    th:field="*{gioKhoiHanh}"
                                    th:value="${#temporals.format(chuyenXe.gioKhoiHanh,'yyyy-MM-dd''T''HH:mm')}">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Giờ đến dự kiến</label>
                            <input
                                    type="datetime-local"
                                    class="form-control"
                                    th:field="*{gioDenDuKien}"
                                    th:value="${#temporals.format(chuyenXe.gioDenDuKien,'yyyy-MM-dd''T''HH:mm')}">
                        </div>
                    </div>

                    <!-- Trạng thái -->
                    <div class="form-floating mb-4">
                        <select
                                class="form-select"
                                id="trangThai"
                                th:field="*{trangThaiChuyen}">
                            <option value="Chờ khởi hành">Chờ khởi hành</option>
                            <option value="Đang chạy">Đang chạy</option>
                            <option value="Hoàn thành">Hoàn thành</option>
                            <option value="Huỷ">Huỷ</option>
                        </select>
                        <label for="trangThai">Trạng thái</label>
                    </div>

                    <!-- Button -->
                    <div class="d-flex justify-content-end gap-2">
                        <a
                                hx-get="/chuyen"
                                hx-target="#main-display"
                                hx-swap="innerHTML"
                                class="btn btn-outline-secondary">
                            Huỷ
                        </a>
                        <button type="submit" class="btn btn-primary">
                            <i class="fa-solid fa-save"></i>
                            Lưu
                        </button>
                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

</body>
</html>
