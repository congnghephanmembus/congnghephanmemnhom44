<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Form chuyến xe</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
</head>
<body>

<div class="container mt-4">

    <h2>Thông tin chuyến xe</h2>

    <form th:action="@{/chuyen/luu}" th:object="${chuyenXe}" method="post">

        <div class="mb-3">
            <label class="form-label">Mã chuyến</label>
            <input type="text" th:field="*{maChuyen}" class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Mã tuyến</label>
            <input type="text" th:field="*{maTuyen}" class="form-control">
        </div>

        <div class="mb-3">
            <label class="form-label">Mã xe</label>
            <input type="text" th:field="*{maXe}" class="form-control">
        </div>

        <div class="mb-3">
            <label class="form-label">Mã lịch</label>
            <input type="text" th:field="*{maLich}" class="form-control">
        </div>

        <div class="mb-3">
            <label class="form-label">Giờ khởi hành</label>
            <input type="datetime-local"
                   th:field="*{gioKhoiHanh}"
                   class="form-control">
        </div>

        <div class="mb-3">
            <label class="form-label">Giờ đến dự kiến</label>
            <input type="datetime-local"
                   th:field="*{gioDenDuKien}"
                   class="form-control">
        </div>

        <div class="mb-3">
            <label class="form-label">Trạng thái</label>
            <input type="text"
                   th:field="*{trangThaiChuyen}"
                   class="form-control">
        </div>

        <button type="submit" class="btn btn-primary">Lưu</button>
        <a href="/chuyen" class="btn btn-secondary">Quay lại</a>

    </form>

</div>

</body>
</html>
