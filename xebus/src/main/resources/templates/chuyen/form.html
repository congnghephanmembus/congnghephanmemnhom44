<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cập nhật chuyến xe</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
    <style>
        body { background-color: #f4f7f6; }
        .card { border: none; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-7">
            <div class="card p-4">
                <h3 class="mb-4 text-center text-primary"><i class="fa-solid fa-bus"></i> Thông tin chuyến xe</h3>
                
                <form th:action="@{/chuyen/luu}" th:object="${chuyenXe}" method="post">
                    <div class="form-floating mb-3">
                        <input type="text" th:field="*{maChuyen}" class="form-control" id="maChuyen" placeholder="Mã chuyến" required>
                        <label for="maChuyen">Mã chuyến</label>
                    </div>

                    <div class="row">
                        <div class="col-md-6 form-floating mb-3">
                            <input type="text" th:field="*{maTuyen}" class="form-control" id="maTuyen" placeholder="Mã tuyến">
                            <label for="maTuyen" class="ms-2">Mã tuyến</label>
                        </div>
                        <div class="col-md-6 form-floating mb-3">
                            <input type="text" th:field="*{maXe}" class="form-control" id="maXe" placeholder="Mã xe">
                            <label for="maXe" class="ms-2">Mã xe</label>
                        </div>
                    </div>

                    <div class="form-floating mb-3">
                        <input type="text" th:field="*{maLich}" class="form-control" id="maLich" placeholder="Mã lịch">
                        <label for="maLich">Mã lịch</label>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label text-muted small">Giờ khởi hành</label>
                            <input type="datetime-local" th:field="*{gioKhoiHanh}" class="form-control">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label text-muted small">Giờ đến dự kiến</label>
                            <input type="datetime-local" th:field="*{gioDenDuKien}" class="form-control">
                        </div>
                    </div>

                    <div class="form-floating mb-4">
                        <select th:field="*{trangThaiChuyen}" class="form-select" id="trangThai">
                            <option value="Dự kiến">Dự kiến</option>
                            <option value="Đang chạy">Đang chạy</option>
                            <option value="Hoàn thành">Hoàn thành</option>
                            <option value="Huỷ">Huỷ</option>
                        </select>
                        <label for="trangThai">Trạng thái</label>
                    </div>

                    <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                        <a href="/chuyen" class="btn btn-outline-secondary px-4">Huỷ</a>
                        <button type="submit" class="btn btn-primary px-4">
                            <i class="fa-solid fa-save"></i> Lưu thông tin
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

</body>
</html>
