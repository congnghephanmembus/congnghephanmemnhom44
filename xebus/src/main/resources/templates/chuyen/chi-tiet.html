<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">

    <title>Chi tiết chuyến xe</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
</head>

<body>

<div class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <h2>Chi tiết chuyến xe</h2>

        <a href="/chuyen"
           class="btn btn-secondary">

            Quay lại

        </a>

    </div>

    <table class="table table-bordered align-middle">

        <tr>
            <th width="30%">Mã chuyến</th>

            <td th:text="${chuyenXe.maChuyen}"></td>
        </tr>

        <tr>
            <th>Mã tuyến</th>

            <td th:text="${chuyenXe.maTuyen}"></td>
        </tr>

        <tr>
            <th>Mã xe</th>

            <td th:text="${chuyenXe.maXe}"></td>
        </tr>

        <tr>
            <th>Giờ khởi hành</th>

            <td th:text="${chuyenXe.gioKhoiHanh}"></td>
        </tr>

        <tr>
            <th>Giờ đến dự kiến</th>

            <td th:text="${chuyenXe.gioDenDuKien}"></td>
        </tr>

        <tr>
            <th>Trạng thái</th>

            <td th:text="${chuyenXe.trangThaiChuyen}"></td>
        </tr>

    </table>

    <div class="mt-4 d-flex gap-2 flex-wrap">

        <!-- Xem lịch chạy -->
        <a th:href="@{/lich/tuyen/{ma}(ma=${chuyenXe.maTuyen})}"
           class="btn btn-info">

            Xem lịch chạy

        </a>

        <!-- Manager + Admin -->
        <a sec:authorize="hasAnyRole('ROLE_QuanLy', 'ROLE_QuanTriVien')"
           th:href="@{/chuyen/sua/{ma}(ma=${chuyenXe.maChuyen})}"
           class="btn btn-warning">

            Sửa chuyến xe

        </a>

        <!-- Manager + Admin -->
        <a sec:authorize="hasAnyRole('ROLE_QuanLy', 'ROLE_QuanTriVien')"
           th:href="@{/chuyen/xoa/{ma}(ma=${chuyenXe.maChuyen})}"
           class="btn btn-danger"
           onclick="return confirm('Xác nhận xoá chuyến xe này?')">

            Xoá chuyến xe

        </a>

    </div>

</div>

</body>
</html>
