<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Chi tiết chuyến xe</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
    <style>
        body { background-color: #f8f9fa; }
        .card { border: none; box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.15); border-radius: 1rem; }
        .table th { color: #6c757d; font-weight: 600; width: 35%; }
        .btn-action { transition: transform 0.2s; }
        .btn-action:hover { transform: translateY(-2px); }
    </style>
</head>
<body>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card p-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h3 class="mb-0"><i class="fa-solid fa-bus text-primary"></i> Chi tiết chuyến xe</h3>
                    <a href="/chuyen" class="btn btn-outline-secondary"><i class="fa-solid fa-arrow-left"></i> Quay lại</a>
                </div>

                <table class="table table-borderless align-middle">
                    <tr>
                        <th><i class="fa-solid fa-barcode me-2"></i>Mã chuyến</th>
                        <td class="fw-bold" th:text="${chuyenXe.maChuyen}"></td>
                    </tr>
                    <tr>
                        <th><i class="fa-solid fa-route me-2"></i>Mã tuyến</th>
                        <td th:text="${chuyenXe.maTuyen}"></td>
                    </tr>
                    <tr>
                        <th><i class="fa-solid fa-car me-2"></i>Mã xe</th>
                        <td th:text="${chuyenXe.maXe}"></td>
                    </tr>
                    <tr>
                        <th><i class="fa-solid fa-calendar-check me-2"></i>Giờ khởi hành</th>
                        <td th:text="${chuyenXe.gioKhoiHanh}"></td>
                    </tr>
                    <tr>
                        <th><i class="fa-solid fa-clock me-2"></i>Giờ đến dự kiến</th>
                        <td th:text="${chuyenXe.gioDenDuKien}"></td>
                    </tr>
                    <tr>
                        <th><i class="fa-solid fa-info-circle me-2"></i>Trạng thái</th>
                        <td>
                            <span class="badge bg-success" th:text="${chuyenXe.trangThaiChuyen}"></span>
                        </td>
                    </tr>
                </table>

                <hr class="my-4">

                <div class="d-flex gap-2 justify-content-end">
                    <a th:href="@{/lich/tuyen/{ma}(ma=${chuyenXe.maTuyen})}" class="btn btn-info text-white btn-action">
                        <i class="fa-solid fa-calendar-days"></i> Xem lịch chạy
                    </a>
                    
                    <div sec:authorize="hasAnyRole('ROLE_QuanLy', 'ROLE_QuanTriVien')">
                        <a th:href="@{/chuyen/sua/{ma}(ma=${chuyenXe.maChuyen})}" class="btn btn-warning btn-action">
                            <i class="fa-solid fa-pen-to-square"></i> Sửa
                        </a>
                        <a th:href="@{/chuyen/xoa/{ma}(ma=${chuyenXe.maChuyen})}" 
                           class="btn btn-danger btn-action" 
                           onclick="return confirm('Xác nhận xoá chuyến xe này?')">
                           <i class="fa-solid fa-trash"></i> Xoá
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
