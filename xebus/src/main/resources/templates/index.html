<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <title>Hệ thống quản lý vé xe buýt nội đô</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>

    <style>

        body{
            background-color: #f5f6fa;
        }

        .menu-card{
            transition: 0.2s;
        }

        .menu-card:hover{
            transform: translateY(-3px);
        }

        .role-badge{
            font-size: 14px;
        }

    </style>
</head>

<body>

<div class="container mt-4">

    <!-- HEADER -->
    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>

            <h1>Hệ thống quản lý vé xe buýt nội đô</h1>

            <h5 class="mt-3">
                Xin chào,
                <strong sec:authentication="name"></strong>
            </h5>

            <!-- ROLE -->
            <div>

                <span class="badge bg-danger role-badge"
                      sec:authorize="hasRole('QuanTriVien')">

                    Quản trị viên

                </span>

                <span class="badge bg-primary role-badge"
                      sec:authorize="hasRole('QuanLy')">

                    Quản lý

                </span>

                <span class="badge bg-success role-badge"
                      sec:authorize="hasRole('NhanVienBanVe')">

                    Nhân viên bán vé

                </span>

            </div>

        </div>

        <!-- LOGOUT -->
        <form th:action="@{/logout}" method="post">

            <button class="btn btn-outline-danger">

                Đăng xuất

            </button>

        </form>

    </div>


    <!-- MENU -->
    <div class="card shadow-sm">

        <div class="card-header">

            <h4 class="mb-0">
                Chức năng hệ thống
            </h4>

        </div>

        <div class="list-group list-group-flush">

            <!-- ========================= -->
            <!-- TUYẾN + CHUYẾN -->
            <!-- STAFF ĐƯỢC XEM -->
            <!-- ========================= -->

            <div sec:authorize="hasAnyRole('NhanVienBanVe','QuanLy','QuanTriVien')">

                <a href="/tuyen"
                   class="list-group-item list-group-item-action">

                    Quản lý tuyến xe

                </a>

                <a href="/chuyen"
                   class="list-group-item list-group-item-action">

                    Quản lý chuyến xe

                </a>

            </div>

            <!-- ========================= -->
            <!-- MANAGER + ADMIN -->
            <!-- ========================= -->

            <div sec:authorize="hasAnyRole('QuanLy','QuanTriVien')">

                <a href="/nhan-vien"
                   class="list-group-item list-group-item-action">

                    Quản lý nhân viên

                </a>

                <a href="/xe"
                   class="list-group-item list-group-item-action">

                    Quản lý xe buýt

                </a>

                <a href="/lich/tuyen/T001"
                   class="list-group-item list-group-item-action">

                    Quản lý lịch chạy

                </a>

            </div>

            <!-- ========================= -->
            <!-- STAFF + MANAGER + ADMIN -->
            <!-- ========================= -->

            <div sec:authorize="hasAnyRole('NhanVienBanVe','QuanLy','QuanTriVien')">

                <a href="/khach-hang"
                   class="list-group-item list-group-item-action">

                    Quản lý khách hàng

                </a>

                <a href="/ve"
                   class="list-group-item list-group-item-action">

                    Quản lý vé

                </a>

                <a href="/thanh-toan"
                   class="list-group-item list-group-item-action">

                    Quản lý thanh toán

                </a>

            </div>

            <!-- ========================= -->
            <!-- ADMIN ONLY -->
            <!-- ========================= -->

            <div sec:authorize="hasRole('QuanTriVien')">

                <a href="/tai-khoan"
                   class="list-group-item list-group-item-action">

                    Quản lý tài khoản

                </a>

                <a href="/nhat-ky"
                   class="list-group-item list-group-item-action">

                    Nhật ký hệ thống

                </a>

            </div>

            <!-- ========================= -->
            <!-- MANAGER + ADMIN -->
            <!-- ========================= -->

            <div sec:authorize="hasAnyRole('QuanLy','QuanTriVien')">

                <a href="/bao-cao"
                   class="list-group-item list-group-item-action">

                    Báo cáo thống kê

                </a>

            </div>

        </div>

    </div>

</div>

</body>
</html>
