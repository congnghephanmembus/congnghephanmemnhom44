<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Chi tiết lịch chạy</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
</head>
<body>

<div class="container mt-4">

    <h2 class="mb-4">Thông tin lịch chạy</h2>

    <table class="table table-bordered">

        <tr>
            <th width="30%">Mã lịch</th>
            <td th:text="${lich.maLich}"></td>
        </tr>

        <tr>
            <th>Mã tuyến</th>
            <td th:text="${lich.tuyenXe.maTuyen}"></td>
        </tr>

        <tr>
            <th>Giờ bắt đầu</th>
            <td th:text="${lich.gioBatDau}"></td>
        </tr>

        <tr>
            <th>Giờ kết thúc</th>
            <td th:text="${lich.gioKetThuc}"></td>
        </tr>

        <tr>
            <th>Tần suất (phút)</th>
            <td th:text="${lich.tanSuatPhut}"></td>
        </tr>

    </table>

    <a href="/tuyen"
       class="btn btn-secondary">
        Quay lại
    </a>

</div>

</body>
</html>
