<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Chi tiết lịch chạy</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
    <style>
        body { background-color: #f8f9fa; }
        .detail-card { border-radius: 15px; border: none; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .list-group-item { padding: 1rem; }
        .label-text { font-weight: 600; color: #555; }
    </style>
</head>
<body>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card detail-card">
                <div class="card-header bg-primary text-white text-center py-3">
                    <h4 class="mb-0"><i class="fa-solid fa-calendar-check"></i> Chi tiết lịch chạy</h4>
                </div>
                <ul class="list-group list-group-flush">
                    <li class="list-group-item">
                        <i class="fa-solid fa-barcode text-primary me-2"></i> 
                        <span class="label-text">Mã lịch:</span> <span th:text="${lich.maLich}"></span>
                    </li>
                    <li class="list-group-item">
                        <i class="fa-solid fa-route text-primary me-2"></i> 
                        <span class="label-text">Mã tuyến:</span> <span th:text="${lich.tuyenXe.maTuyen}"></span>
                    </li>
                    <li class="list-group-item">
                        <i class="fa-solid fa-clock text-success me-2"></i> 
                        <span class="label-text">Giờ bắt đầu:</span> <span th:text="${lich.gioBatDau}"></span>
                    </li>
                    <li class="list-group-item">
                        <i class="fa-solid fa-clock text-danger me-2"></i> 
                        <span class="label-text">Giờ kết thúc:</span> <span th:text="${lich.gioKetThuc}"></span>
                    </li>
                    <li class="list-group-item">
                        <i class="fa-solid fa-hourglass-half text-warning me-2"></i> 
                        <span class="label-text">Tần suất (phút):</span> <span th:text="${lich.tanSuatPhut}"></span>
                    </li>
                </ul>
                <div class="card-body text-center">
                    <a th:attr="hx-get=@{/lich/tuyen/{ma}(ma=${lich.tuyenXe.maTuyen})}"
                       hx-target="#main-display"
                       hx-swap="innerHTML"
                       class="btn btn-outline-secondary px-4">
                        <i class="fa-solid fa-arrow-left"></i> Quay lại
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
