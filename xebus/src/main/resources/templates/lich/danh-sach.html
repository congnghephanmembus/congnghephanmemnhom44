<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">

    <title>Danh sách lịch chạy</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
</head>

<body>

<div class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-3">

        <div>

            <h2 class="mb-1">
                Lịch chạy tuyến
            </h2>

            <div class="text-muted">
                Mã tuyến:
                <strong th:text="${maTuyen}"></strong>
            </div>

        </div>

        <a href="/tuyen"
           class="btn btn-secondary">

            Quay lại

        </a>

    </div>

    <!-- Admin + Manager -->
    <a sec:authorize="hasAnyRole('ROLE_QuanTriVien', 'ROLE_QuanLy')"
       href="/lich/them"
       class="btn btn-success mb-3">

        + Thêm lịch chạy

    </a>

    <table class="table table-bordered table-hover align-middle">

        <thead class="table-dark">

        <tr>

            <th>Mã lịch</th>

            <th>Giờ bắt đầu</th>

            <th>Giờ kết thúc</th>

            <th>Tần suất (phút)</th>

            <th width="260">
                Hành động
            </th>

        </tr>

        </thead>

        <tbody>

        <tr th:each="l : ${danhSach}">

            <td th:text="${l.maLich}"></td>

            <td th:text="${l.gioBatDau}"></td>

            <td th:text="${l.gioKetThuc}"></td>

            <td th:text="${l.tanSuatPhut}"></td>

            <td>

                <!-- Ai có quyền xem lịch đều xem được -->
                <a th:href="@{/lich/chi-tiet/{ma}(ma=${l.maLich})}"
                   class="btn btn-info btn-sm">

                    Chi tiết

                </a>

                <!-- Admin + Manager -->
                <a sec:authorize="hasAnyRole('ROLE_QuanTriVien', 'ROLE_QuanLy')"
                   th:href="@{/lich/sua/{ma}(ma=${l.maLich})}"
                   class="btn btn-warning btn-sm">

                    Sửa

                </a>

                <!-- Chỉ Admin -->
                <a sec:authorize="hasRole('ROLE_QuanTriVien')"
                   th:href="@{/lich/xoa/{ma}(ma=${l.maLich})}"
                   class="btn btn-danger btn-sm"
                   onclick="return confirm('Xác nhận xoá lịch chạy này?')">

                    Xoá

                </a>

            </td>

        </tr>

        </tbody>

    </table>

</div>

</body>
</html>
