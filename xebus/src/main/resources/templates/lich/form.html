<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Cập nhật lịch chạy</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>

    <style>
        body{
            background:#f4f7f6;
        }

        .card{
            border:none;
            border-radius:15px;
            box-shadow:0 10px 25px rgba(0,0,0,.1);
        }
    </style>
</head>

<body>

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-7">

            <div class="card p-4">

                <h3 class="text-center text-primary mb-4">
                    <i class="fa-solid fa-calendar-check"></i>
                    Thông tin lịch chạy
                </h3>

                <form
                        hx-post="/lich/luu"
                        hx-target="#main-display"
                        hx-swap="innerHTML"
                        th:object="${lichChay}">

                    <!-- CSRF Token -->
                    <input type="hidden"
                           th:name="${_csrf.parameterName}"
                           th:value="${_csrf.token}" />

                    <!-- Mã lịch - READONLY -->
                    <div class="form-floating mb-3">
                        <input
                                class="form-control"
                                id="maLich"
                                placeholder="Mã lịch"
                                th:field="*{maLich}"
                                readonly
                                required>
                        <label for="maLich">Mã lịch</label>
                    </div>

                    <!-- Mã tuyến - READONLY -->
                    <div class="form-floating mb-3">
                        <input
                                class="form-control"
                                id="maTuyen"
                                placeholder="Mã tuyến"
                                th:field="*{tuyenXe.maTuyen}"
                                readonly
                                required>
                        <label for="maTuyen">Mã tuyến</label>
                    </div>

                    <!-- Giờ bắt đầu - SỬA: CHỈ DÙNG th:value, KHÔNG dùng th:field -->
                    <div class="form-floating mb-3">
                        <input
                                type="time"
                                class="form-control"
                                id="gioBatDau"
                                name="gioBatDau"
                                placeholder="Giờ bắt đầu"
                                th:value="${#temporals.format(lichChay.gioBatDau, 'HH:mm')}"
                                required>
                        <label for="gioBatDau">Giờ bắt đầu</label>
                    </div>

                    <!-- Giờ kết thúc - SỬA: CHỈ DÙNG th:value, KHÔNG dùng th:field -->
                    <div class="form-floating mb-3">
                        <input
                                type="time"
                                class="form-control"
                                id="gioKetThuc"
                                name="gioKetThuc"
                                placeholder="Giờ kết thúc"
                                th:value="${#temporals.format(lichChay.gioKetThuc, 'HH:mm')}"
                                required>
                        <label for="gioKetThuc">Giờ kết thúc</label>
                    </div>

                    <!-- Tần suất -->
                    <div class="form-floating mb-4">
                        <input
                                type="number"
                                min="1"
                                class="form-control"
                                id="tanSuatPhut"
                                placeholder="Tần suất (phút)"
                                th:field="*{tanSuatPhut}"
                                required>
                        <label for="tanSuatPhut">Tần suất (phút)</label>
                    </div>

                    <!-- Button -->
                    <div class="d-flex justify-content-end gap-2">
                        <a th:attr="hx-get=@{/lich/tuyen/{ma}(ma=${lichChay.tuyenXe.maTuyen})}"
                           hx-target="#main-display"
                           hx-swap="innerHTML"
                           class="btn btn-outline-secondary">
                            Huỷ
                        </a>
                        <button type="submit" class="btn btn-primary">
                            <i class="fa-solid fa-save"></i>
                            Lưu
                        </button>
                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

</body>
</html>
