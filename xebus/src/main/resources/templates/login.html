<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đăng nhập | Hệ thống Quản lý</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
    <style>
        body { background: linear-gradient(135deg, #e0eafc 0%, #cfdef3 100%); min-height: 100vh; display: flex; align-items: center; }
        .login-card { border: none; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); overflow: hidden; }
        .input-group-text { background: #f8f9fa; border-right: none; }
        .form-control { border-left: none; padding: 0.75rem; }
        .form-control:focus { box-shadow: none; border-color: #dee2e6; }
        .btn-primary { padding: 0.75rem; font-weight: 600; border-radius: 10px; }
    </style>
</head>
<body>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-4">
            <div class="card login-card p-4">
                <div class="card-body">
                    <div class="text-center mb-4">
                        <div class="mb-3 text-primary" style="font-size: 3rem;"><i class="fa-solid fa-bus-simple"></i></div>
                        <h4 class="fw-bold">Đăng nhập</h4>
                        <p class="text-muted small">Chào mừng bạn trở lại hệ thống</p>
                    </div>

                    <div th:if="${param.error}" class="alert alert-danger alert-dismissible fade show text-center py-2" role="alert">
                        <i class="fa-solid fa-circle-exclamation"></i> Sai tên đăng nhập hoặc mật khẩu.
                    </div>

                    <div th:if="${param.logout}" class="alert alert-success alert-dismissible fade show text-center py-2" role="alert">
                        <i class="fa-solid fa-check"></i> Đăng xuất thành công.
                    </div>

                    <form th:action="@{/login}" method="post">
                        <div class="input-group mb-3">
                            <span class="input-group-text"><i class="fa-solid fa-user text-muted"></i></span>
                            <input type="text" class="form-control" name="username" placeholder="Tên đăng nhập" required>
                        </div>

                        <div class="input-group mb-4">
                            <span class="input-group-text"><i class="fa-solid fa-lock text-muted"></i></span>
                            <input type="password" class="form-control" name="password" placeholder="Mật khẩu" required>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 shadow-sm">Đăng nhập</button>
                    </form>

                    <hr class="my-4">
                    <div class="text-center">
                        <p class="text-muted small">Vai trò được hỗ trợ:</p>
                        <span class="badge bg-light text-dark border m-1">Nhân viên</span>
                        <span class="badge bg-light text-dark border m-1">Quản lý</span>
                        <span class="badge bg-light text-dark border m-1">Admin</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
