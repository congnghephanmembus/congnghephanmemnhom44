<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Nhật ký hệ thống</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
</head>

<body>

<div class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-3">

        <h2 class="mb-0">
            Nhật ký hệ thống
        </h2>

        <a href="/"
           class="btn btn-secondary">

            Trang chủ

        </a>

    </div>

    <table class="table table-bordered table-hover align-middle">

        <thead class="table-dark">

        <tr>

            <th>Thời gian</th>

            <th>Tài khoản</th>

            <th>Chức năng</th>

            <th>Đối tượng</th>

            <th>Mã đối tượng</th>

            <th>Nội dung</th>

            <th>Kết quả</th>

        </tr>

        </thead>

        <tbody>

        <tr th:each="log : ${danhSach}">

            <td th:text="${log.thoiGian}">
            </td>

            <td th:text="${log.maTaiKhoan}">
            </td>

            <td th:text="${log.chucNang}">
            </td>

            <td th:text="${log.doiTuongTacDong}">
            </td>

            <td th:text="${log.maDoiTuong}">
            </td>

            <td th:text="${log.noiDungChiTiet}">
            </td>

            <td th:text="${log.ketQua}">
            </td>

        </tr>

        </tbody>

    </table>

</div>

</body>
</html>
