<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Chi tiết tuyến</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>

</head>

<body>

<div class="container mt-4">

    <h2 class="mb-4">
        Danh sách trạm
    </h2>

    <a href="/tuyen"
       class="btn btn-secondary mb-3">
        Quay lại
    </a>

    <table class="table table-bordered">

        <thead class="table-dark">

        <tr>
            <th>Tên trạm</th>
            <th>Hành động</th>
        </tr>

        </thead>

        <tbody>

        <th:block th:each="tram : ${dsTram}">

            <tr>

                <td th:text="${tram.tenTram}">
                </td>

                <td>

                    <button class="btn btn-primary btn-sm"
                            type="button"
                            data-bs-toggle="collapse"
                            th:data-bs-target="'#tram' + ${tram.maTram}">

                        Xem chi tiết

                    </button>

                </td>

            </tr>

            <tr th:id="'tram' + ${tram.maTram}"
                class="collapse">

                <td colspan="2">

                    <b>Tên trạm:</b>

                    <span th:text="${tram.tenTram}">
                    </span>

                    <br><br>

                    <b>Địa chỉ:</b>

                    <span th:text="${tram.diaChi}">
                    </span>

                </td>

            </tr>

        </th:block>

        </tbody>

    </table>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js">
</script>

</body>

</html>
