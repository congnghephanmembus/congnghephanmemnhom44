<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Chi tiết tuyến xe</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
    <style>
        body { background-color: #f4f7f6; }
        .station-card { border-radius: 12px; border: none; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .list-group-item { border: none; border-bottom: 1px solid #eee; padding: 1.2rem; transition: 0.2s; }
        .list-group-item:hover { background-color: #f9f9f9; }
        .btn-view { font-size: 0.85rem; border-radius: 20px; }
    </style>
</head>
<body>

<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="text-dark fw-bold"><i class="fa fa-route text-primary"></i> Lộ trình trạm</h2>
        <a href="/tuyen" class="btn btn-outline-secondary"><i class="fa fa-arrow-left"></i> Quay lại</a>
    </div>

    <div class="card station-card p-3">
        <ul class="list-group list-group-flush">
            <th:block th:each="tram : ${dsTram}">
                <li class="list-group-item d-flex justify-content-between align-items-center">
                    <div>
                        <i class="fa fa-map-marker-alt text-danger me-3"></i>
                        <span class="fw-bold fs-5" th:text="${tram.tenTram}">Tên trạm</span>
                    </div>
                    <button class="btn btn-outline-primary btn-view" 
                            type="button" 
                            data-bs-toggle="collapse" 
                            th:data-bs-target="'#tram' + ${tram.maTram}">
                        <i class="fa fa-info-circle"></i> Chi tiết
                    </button>
                </li>
                
                <div th:id="'tram' + ${tram.maTram}" class="collapse">
                    <div class="card card-body bg-light m-3 border-0">
                        <p class="mb-1"><small class="text-muted text-uppercase">Địa chỉ cụ thể:</small></p>
                        <p class="mb-0 fs-6"><i class="fa fa-location-dot me-2 text-secondary"></i><span th:text="${tram.diaChi}">Địa chỉ trạm</span></p>
                    </div>
                </div>
            </th:block>
        </ul>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
