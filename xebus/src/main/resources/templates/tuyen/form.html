<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Form tuyến xe</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
</head>
<body>

<div class="container mt-4">

    <h2>Thông tin tuyến xe</h2>

    <form th:action="@{/tuyen/luu}" th:object="${tuyenXe}" method="post">

        <div class="mb-3">
            <label class="form-label">Mã tuyến</label>
            <input type="text" th:field="*{maTuyen}" class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Tên tuyến</label>
            <input type="text" th:field="*{tenTuyen}" class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Điểm đầu</label>
            <input type="text" th:field="*{diemDau}" class="form-control">
        </div>

        <div class="mb-3">
            <label class="form-label">Điểm cuối</label>
            <input type="text" th:field="*{diemCuoi}" class="form-control">
        </div>

        <div class="mb-3">
            <label class="form-label">Cự ly km</label>
            <input type="number" step="0.01" th:field="*{cuLy}" class="form-control">
        </div>

        <div class="mb-3">
            <label class="form-label">Trạng thái</label>
            <input type="text" th:field="*{trangThai}" class="form-control">
        </div>

        <button type="submit" class="btn btn-primary">Lưu</button>
        <a href="/tuyen" class="btn btn-secondary">Quay lại</a>

    </form>

</div>

</body>
</html>
