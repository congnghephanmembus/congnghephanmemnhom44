<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Thông tin tuyến xe</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
    <style>
        body { background-color: #f8f9fa; }
        .form-card { border-radius: 15px; border: none; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .form-label { font-weight: 600; color: #34495e; }
    </style>
</head>
<body>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card form-card p-4">
                <h3 class="mb-4 text-center text-primary">
                    <i class="fa" th:classappend="${tuyenXe.maTuyen == null or tuyenXe.maTuyen == ''} ? 'fa-plus-circle' : 'fa-edit'"></i>
                    <span th:if="${tuyenXe.maTuyen == null or tuyenXe.maTuyen == ''}">Thêm tuyến xe mới</span>
                    <span th:unless="${tuyenXe.maTuyen == null or tuyenXe.maTuyen == ''}">Cập nhật tuyến xe</span>
                </h3>

                <form th:action="@{/tuyen/luu}" th:object="${tuyenXe}" method="post">
                    <div class="mb-3">
                        <label class="form-label"><i class="fa fa-barcode"></i> Mã tuyến</label>
                        <input type="text" th:field="*{maTuyen}" class="form-control" 
                               th:readonly="${tuyenXe.maTuyen != null and tuyenXe.maTuyen != ''}"
                               placeholder="Ví dụ: T001" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label"><i class="fa fa-route"></i> Tên tuyến</label>
                        <input type="text" th:field="*{tenTuyen}" class="form-control" placeholder="Ví dụ: Bến Thành - Chợ Lớn" required>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label"><i class="fa fa-map-marker-alt"></i> Điểm đầu</label>
                            <input type="text" th:field="*{diemDau}" class="form-control" placeholder="Điểm bắt đầu">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label"><i class="fa fa-map-marker-check"></i> Điểm cuối</label>
                            <input type="text" th:field="*{diemCuoi}" class="form-control" placeholder="Điểm kết thúc">
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label"><i class="fa fa-road"></i> Cự ly (km)</label>
                            <input type="number" step="0.01" min="0" th:field="*{cuLy}" class="form-control" placeholder="0.00">
                        </div>
                        <div class="col-md-6 mb-4">
                            <label class="form-label"><i class="fa fa-toggle-on"></i> Trạng thái</label>
                            <select th:field="*{trangThai}" class="form-select">
                                <option value="Hoạt động">Hoạt động</option>
                                <option value="Tạm ngưng">Tạm ngưng</option>
                            </select>
                        </div>
                    </div>

                    <hr class="my-3">

                    <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                        <a href="/tuyen" class="btn btn-outline-secondary px-4"><i class="fa fa-times"></i> Huỷ</a>
                        <button type="submit" class="btn btn-primary px-4"><i class="fa fa-save"></i> Lưu dữ liệu</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

</body>
</html>
