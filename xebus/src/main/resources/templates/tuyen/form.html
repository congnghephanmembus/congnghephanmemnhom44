<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Cập nhật tuyến xe</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>

    <style>
        body{
            background:#f4f7f6;
        }

        .card{
            border:none;
            border-radius:15px;
            box-shadow:0 10px 25px rgba(0,0,0,.1);
        }

        /* Thêm style cho thông báo lỗi */
        .error-message {
            color: #dc3545;
            font-size: 0.875rem;
            margin-top: 0.25rem;
            display: none;
        }
    </style>
</head>

<body>

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-7">

            <div class="card p-4">

                <h3 class="text-center text-primary mb-4">
                    <i class="fa-solid fa-route"></i>
                    Thông tin tuyến xe
                </h3>

                <form
                        id="tuyenForm"
                        hx-post="/tuyen/luu"
                        hx-target="#main-display"
                        hx-swap="innerHTML"
                        th:object="${tuyenXe}">

                    <!-- CSRF Token -->
                    <input type="hidden"
                           th:name="${_csrf.parameterName}"
                           th:value="${_csrf.token}" />

                    <!-- Mã tuyến -->
                    <div class="form-floating mb-3">
                        <input
                                type="text"
                                class="form-control"
                                id="maTuyen"
                                name="maTuyen"
                                placeholder="Mã tuyến"
                                th:value="${tuyenXe.maTuyen}"
                                readonly
                                required>
                        <label for="maTuyen">Mã tuyến</label>
                    </div>

                    <!-- Tên tuyến -->
                    <div class="form-floating mb-3">
                        <input
                                type="text"
                                class="form-control"
                                id="tenTuyen"
                                name="tenTuyen"
                                placeholder="Tên tuyến"
                                th:value="${tuyenXe.tenTuyen}"
                                readonly>
                        <label for="tenTuyen">Tên tuyến</label>
                        <small class="text-muted">Tên tuyến sẽ tự động tạo từ điểm đầu và điểm cuối</small>
                    </div>

                    <!-- Điểm đầu -->
                    <div class="form-floating mb-3">
                        <select
                                class="form-select"
                                id="diemDau"
                                name="diemDau"
                                onchange="autoGenerateTenTuyen(); clearError();"
                                required>
                            <option value="">-- Chọn điểm đầu --</option>
                            <option th:each="tram : ${danhSachTram}"
                                    th:value="${tram.tenTram}"
                                    th:text="${tram.tenTram}"
                                    th:selected="${tram.tenTram == tuyenXe.diemDau}">
                            </option>
                        </select>
                        <label for="diemDau">Điểm đầu</label>
                    </div>

                    <!-- Điểm cuối -->
                    <div class="form-floating mb-3">
                        <select
                                class="form-select"
                                id="diemCuoi"
                                name="diemCuoi"
                                onchange="autoGenerateTenTuyen(); clearError();"
                                required>
                            <option value="">-- Chọn điểm cuối --</option>
                            <option th:each="tram : ${danhSachTram}"
                                    th:value="${tram.tenTram}"
                                    th:text="${tram.tenTram}"
                                    th:selected="${tram.tenTram == tuyenXe.diemCuoi}">
                            </option>
                        </select>
                        <label for="diemCuoi">Điểm cuối</label>
                    </div>

                    <!-- Thông báo lỗi -->
                    <div id="errorMessage" class="error-message">
                        <i class="fa-solid fa-circle-exclamation"></i>
                        Điểm đầu và điểm cuối không được trùng nhau!
                    </div>

                    <!-- Cự ly -->
                    <div class="form-floating mb-3">
                        <input
                                type="number"
                                step="0.01"
                                min="0"
                                class="form-control"
                                id="cuLy"
                                name="cuLy"
                                placeholder="Cự ly"
                                th:value="${tuyenXe.cuLy}"
                                required>
                        <label for="cuLy">Cự ly (km)</label>
                    </div>

                    <!-- Trạng thái -->
                    <div class="form-floating mb-4">
                        <select
                                class="form-select"
                                id="trangThai"
                                name="trangThai">
                            <option value="Hoạt động" th:selected="${tuyenXe.trangThai == 'Hoạt động'}">Hoạt động</option>
                            <option value="Tạm ngưng" th:selected="${tuyenXe.trangThai == 'Tạm ngưng'}">Tạm ngưng</option>
                        </select>
                        <label for="trangThai">Trạng thái</label>
                    </div>

                    <!-- Button -->
                    <div class="d-flex justify-content-end gap-2">
                        <a
                                hx-get="/tuyen"
                                hx-target="#main-display"
                                hx-swap="innerHTML"
                                class="btn btn-outline-secondary">
                            Huỷ
                        </a>
                        <button type="submit" class="btn btn-primary" onclick="return validateForm();">
                            <i class="fa-solid fa-save"></i>
                            Lưu
                        </button>
                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

<!-- JavaScript -->
<script>
    function autoGenerateTenTuyen() {
        var diemDau = document.getElementById('diemDau');
        var diemCuoi = document.getElementById('diemCuoi');
        var tenTuyen = document.getElementById('tenTuyen');
        
        var dau = diemDau.value;
        var cuoi = diemCuoi.value;
        
        if (dau && cuoi) {
            tenTuyen.value = 'Tuyến ' + dau + ' - ' + cuoi;
        } else {
            tenTuyen.value = '';
        }
    }

    function clearError() {
        var error = document.getElementById('errorMessage');
        error.style.display = 'none';
    }

    function validateForm() {
        var diemDau = document.getElementById('diemDau').value;
        var diemCuoi = document.getElementById('diemCuoi').value;
        var error = document.getElementById('errorMessage');

        if (diemDau && diemCuoi && diemDau === diemCuoi) {
            error.style.display = 'block';
            // Cuộn lên để thấy thông báo lỗi
            error.scrollIntoView({ behavior: 'smooth', block: 'center' });
            return false; // Ngăn không cho submit form
        }

        return true; // Cho phép submit form
    }

    // Khi trang load, tự động chạy 1 lần để tạo tên nếu đã có dữ liệu
    window.onload = function() {
        autoGenerateTenTuyen();
        // Kiểm tra nếu đang sửa mà điểm đầu = điểm cuối, hiển thị lỗi
        validateForm();
    };
</script>

</body>
</html>
