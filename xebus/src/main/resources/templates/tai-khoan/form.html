<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Thông tin tài khoản</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
    <style>
        body { background-color: #f8f9fa; }
        .form-card { border-radius: 15px; border: none; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .form-label { font-weight: 600; color: #34495e; }
    </style>
</head>
<body>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card form-card p-4">
                <h3 class="mb-4 text-center text-primary">
                    <i class="fa fa-user-cog"></i> Thông tin tài khoản
                </h3>

                <form th:action="@{/tai-khoan/luu}" th:object="${taiKhoan}" method="post">
                    
                    <div class="mb-3">
                        <label class="form-label"><i class="fa fa-user"></i> Tên đăng nhập</label>
                        <input type="text" th:field="*{tenDangNhap}" class="form-control" placeholder="Nhập username" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label"><i class="fa fa-lock"></i> Mật khẩu</label>
                        <input type="password" th:field="*{matKhau}" class="form-control" placeholder="********" required>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label"><i class="fa fa-user-tag"></i> Vai trò</label>
                            <select th:field="*{vaiTro}" class="form-select">
                                <option value="ROLE_QuanTriVien">Quản trị viên</option>
                                <option value="ROLE_QuanLy">Quản lý</option>
                                <option value="ROLE_NhanVienBanVe">Nhân viên bán vé</option>
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label"><i class="fa fa-id-card"></i> Mã nhân viên</label>
                            <input type="text" th:field="*{maNV}" class="form-control" placeholder="NV...">
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label"><i class="fa fa-toggle-on"></i> Trạng thái</label>
                        <select th:field="*{trangThai}" class="form-select">
                            <option value="Hoạt động">Hoạt động</option>
                            <option value="Bị khoá">Bị khoá</option>
                        </select>
                    </div>

                    <hr class="my-3">

                    <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                        <a href="/tai-khoan" class="btn btn-outline-secondary px-4">
                            <i class="fa fa-arrow-left"></i> Quay lại
                        </a>
                        <button type="submit" class="btn btn-primary px-4">
                            <i class="fa fa-save"></i> Lưu tài khoản
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

</body>
</html>
