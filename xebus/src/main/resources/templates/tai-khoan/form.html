<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Thông tin tài khoản</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>

    <style>
        body{
            background:#f4f7f6;
        }

        .card{
            border:none;
            border-radius:15px;
            box-shadow:0 10px 25px rgba(0,0,0,.1);
        }

        /* ===== Password Toggle ===== */
        .password-wrapper{
            position:relative;
        }

        .password-wrapper .form-control{
            padding-right:50px;
        }

        .password-wrapper .btn-toggle{
            position:absolute;
            top:50%;
            right:15px;
            transform:translateY(-50%);
            border:none;
            background:transparent;
            color:#6c757d;
            cursor:pointer;
            z-index:1000;
            padding:0;
        }

        .password-wrapper .btn-toggle:hover{
            color:#0d6efd;
        }

        .password-wrapper .btn-toggle:focus{
            outline:none;
            box-shadow:none;
        }

    </style>
</head>

<body>

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-7">

            <div class="card p-4">

                <h3 class="text-center text-primary mb-4">
                    <i class="fa-solid fa-user-cog"></i>
                    Thông tin tài khoản
                </h3>

                <form
                        hx-post="/tai-khoan/luu"
                        hx-target="#main-display"
                        hx-swap="innerHTML"
                        th:object="${taiKhoan}">

                    <!-- CSRF Token -->
                    <input type="hidden"
                           th:name="${_csrf.parameterName}"
                           th:value="${_csrf.token}" />

                    <!-- Mã tài khoản -->
                    <div class="form-floating mb-3">
                        <input
                                type="text"
                                class="form-control"
                                id="maTaiKhoan"
                                name="maTaiKhoan"
                                placeholder="Mã tài khoản"
                                th:value="${taiKhoan.maTaiKhoan}"
                                readonly
                                required>
                        <label for="maTaiKhoan">Mã tài khoản</label>
                    </div>

                    <!-- Tên đăng nhập -->
                    <div class="form-floating mb-3">
                        <input
                                type="text"
                                class="form-control"
                                id="tenDangNhap"
                                name="tenDangNhap"
                                placeholder="Tên đăng nhập"
                                th:value="${taiKhoan.tenDangNhap}"
                                th:readonly="${taiKhoan.tenDangNhap != null and taiKhoan.tenDangNhap != ''}"
                                required>
                        <label for="tenDangNhap">Tên đăng nhập</label>
                    </div>

                    <!-- Mật khẩu -->
                    <div class="mb-3">

                        <div class="password-wrapper">

                            <div class="form-floating">

                                <input
                                        type="password"
                                        class="form-control"
                                        id="matKhau"
                                        name="matKhau"
                                        placeholder="Mật khẩu"
                                        th:value="${taiKhoan.matKhau}"
                                        required>

                                <label for="matKhau">
                                    Mật khẩu
                                </label>

                            </div>

                            <button
                                    type="button"
                                    class="btn-toggle"
                                    onclick="togglePassword()">

                                <i class="fa-solid fa-eye"
                                   id="toggleIcon"></i>

                            </button>

                        </div>

                    </div>

                    <!-- Vai trò -->
                    <div class="form-floating mb-3">
                        <select
                                class="form-select"
                                id="vaiTro"
                                name="vaiTro">
                            <option value="QuanTriVien" th:selected="${taiKhoan.vaiTro == 'QuanTriVien'}">Quản trị viên</option>
                            <option value="QuanLy" th:selected="${taiKhoan.vaiTro == 'QuanLy'}">Quản lý</option>
                            <option value="NhanVienBanVe" th:selected="${taiKhoan.vaiTro == 'NhanVienBanVe'}">Nhân viên bán vé</option>
                        </select>
                        <label for="vaiTro">Vai trò</label>
                    </div>

                    <!-- Mã nhân viên -->
                    <div class="form-floating mb-3">
                        <input
                                type="text"
                                class="form-control"
                                id="maNV"
                                name="maNV"
                                placeholder="Nhập tên hoặc mã nhân viên"
                                list="danhSachNhanVienList"
                                th:value="${taiKhoan.maNV}"
                                autocomplete="off">
                        <datalist id="danhSachNhanVienList">
                            <option th:each="nv : ${danhSachNhanVien}"
                                    th:value="${nv.maNV}"
                                    th:label="${nv.maNV + ' - ' + nv.hoTen}">
                            </option>
                        </datalist>
                        <label for="maNV">Mã nhân viên (gõ tên để tìm)</label>
                        <small class="text-muted">Nhập tên hoặc mã nhân viên để tìm kiếm</small>
                    </div>

                    <!-- Trạng thái -->
                    <div class="form-floating mb-4">
                        <select
                                class="form-select"
                                id="trangThai"
                                name="trangThai">
                            <option value="Hoạt động" th:selected="${taiKhoan.trangThai == 'Hoạt động'}">Hoạt động</option>
                            <option value="Bị khoá" th:selected="${taiKhoan.trangThai == 'Bị khoá'}">Bị khoá</option>
                        </select>
                        <label for="trangThai">Trạng thái</label>
                    </div>

                    <!-- Button -->
                    <div class="d-flex justify-content-end gap-2">
                        <a
                                hx-get="/tai-khoan"
                                hx-target="#main-display"
                                hx-swap="innerHTML"
                                class="btn btn-outline-secondary">
                            Huỷ
                        </a>
                        <button type="submit" class="btn btn-primary">
                            <i class="fa-solid fa-save"></i>
                            Lưu
                        </button>
                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

<script>
    function togglePassword() {
        const passwordField = document.getElementById('matKhau');
        const toggleIcon = document.getElementById('toggleIcon');

        if (passwordField.type === 'password') {
            passwordField.type = 'text';
            toggleIcon.className = 'fa-solid fa-eye-slash';
        } else {
            passwordField.type = 'password';
            toggleIcon.className = 'fa-solid fa-eye';
        }
    }
</script>

</body>
</html>
