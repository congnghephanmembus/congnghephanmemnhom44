<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Form tài khoản</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
</head>

<body>

<div class="container mt-4">

    <h2>Thông tin tài khoản</h2>

    <form th:action="@{/tai-khoan/luu}"
          th:object="${taiKhoan}"
          method="post">

        <div class="mb-3">
            <label class="form-label">
                Tên đăng nhập
            </label>

            <input type="text"
                   th:field="*{tenDangNhap}"
                   class="form-control"
                   required>
        </div>

        <div class="mb-3">
            <label class="form-label">
                Mật khẩu
            </label>

            <input type="text"
                   th:field="*{matKhau}"
                   class="form-control"
                   required>
        </div>

        <div class="mb-3">
            <label class="form-label">
                Vai trò
            </label>

            <input type="text"
                   th:field="*{vaiTro}"
                   class="form-control">
        </div>

        <div class="mb-3">
            <label class="form-label">
                Mã nhân viên
            </label>

            <input type="text"
                   th:field="*{maNV}"
                   class="form-control">
        </div>

        <div class="mb-3">
            <label class="form-label">
                Trạng thái
            </label>

            <select th:field="*{trangThai}"
                    class="form-select">

                <option value="Hoạt động">
                    Hoạt động
                </option>

                <option value="Bị khoá">
                    Bị khoá
                </option>

            </select>
        </div>

        <button type="submit"
                class="btn btn-primary">

            Lưu

        </button>

        <a href="/tai-khoan"
           class="btn btn-secondary">

            Quay lại

        </a>

    </form>

</div>

</body>
</html>
