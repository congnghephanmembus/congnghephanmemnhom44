<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <title>Quản lý tài khoản</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>

    <style>
        body {
            background-color: #f4f7f6;
        }

        .card {
            border: none;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .table thead {
            background-color: #343a40;
            color: white;
        }

        .btn-sm {
            padding: 0.25rem 0.5rem;
            font-size: 0.8rem;
        }

        .role-badge {
            font-size: 0.85em;
            padding: 5px 10px;
            border-radius: 20px;
        }
    </style>
</head>

<body>

<div class="container mt-5">
    <div class="card p-4">

        <div class="d-flex justify-content-between align-items-center mb-4">

            <h2 class="fw-bold text-primary">
                <i class="fa-solid fa-user-shield"></i>
                Quản lý Tài khoản
            </h2>

            <div>

                <a href="/" class="btn btn-outline-secondary">
                    <i class="fa-solid fa-house"></i>
                    Trang chủ
                </a>

                <a sec:authorize="hasRole('ROLE_QuanTriVien')"
                   hx-get="/tai-khoan/them"
                   hx-target="#main-display"
                   hx-swap="innerHTML"
                   class="btn btn-success ms-2">

                    <i class="fa-solid fa-plus"></i>
                    Thêm mới

                </a>

            </div>

        </div>

        <div class="table-responsive">

            <table class="table table-hover align-middle">

                <thead class="table-dark">

                <tr>
                    <th>Mã tài khoản</th>
                    <th>Tên đăng nhập</th>
                    <th>Vai trò</th>
                    <th>Mã nhân viên</th>
                    <th>Trạng thái</th>
                    <th class="text-center">Hành động</th>
                </tr>

                </thead>

                <tbody>

                <tr th:each="t : ${danhSach}">

                    <td class="fw-bold" th:text="${t.maTaiKhoan}"></td>

                    <td>
                        <i class="fa-solid fa-user-circle text-secondary me-2"></i>
                        <span th:text="${t.tenDangNhap}"></span>
                    </td>

                    <td>
                        <span class="badge bg-dark role-badge" th:text="${t.vaiTro}"></span>
                    </td>

                    <td th:text="${t.maNV}"></td>

                    <td>
                        <span class="badge"
                              th:classappend="${t.trangThai == 'Hoạt động' ? 'bg-success' : 'bg-danger'}"
                              th:text="${t.trangThai}">
                        </span>
                    </td>

                    <td class="text-center">

                        <!-- Sửa - SỬA: dùng maTaiKhoan -->
                        <a sec:authorize="hasRole('ROLE_QuanTriVien')"
                           th:attr="hx-get=@{/tai-khoan/sua/{ma}(ma=${t.maTaiKhoan})}"
                           hx-target="#main-display"
                           hx-swap="innerHTML"
                           class="btn btn-outline-warning btn-sm">

                            <i class="fa-solid fa-pen"></i>

                        </a>

                        <!-- Xóa - SỬA: dùng maTaiKhoan -->
                        <a sec:authorize="hasRole('ROLE_QuanTriVien')"
                           th:attr="hx-get=@{/tai-khoan/xoa/{ma}(ma=${t.maTaiKhoan})}"
                           hx-target="#main-display"
                           hx-swap="innerHTML"
                           onclick="return confirm('Xác nhận xoá tài khoản này?')"
                           class="btn btn-outline-danger btn-sm">

                            <i class="fa-solid fa-trash"></i>

                        </a>

                    </td>

                </tr>

                </tbody>

            </table>

        </div>

    </div>
</div>

</body>
</html>
