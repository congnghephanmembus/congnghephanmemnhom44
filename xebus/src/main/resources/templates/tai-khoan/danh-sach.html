<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <title>Danh sách tài khoản</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
</head>

<body>

<div class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-3">

        <h2 class="mb-0">
            Danh sách tài khoản
        </h2>

        <a href="/"
           class="btn btn-secondary">

            Trang chủ

        </a>

    </div>

    <a href="/tai-khoan/them"
       class="btn btn-success mb-3">

        + Thêm tài khoản mới

    </a>

    <table class="table table-bordered table-hover align-middle">

        <thead class="table-dark">

        <tr>

            <th>
                Tên đăng nhập
            </th>

            <th width="160">
                Mật khẩu
            </th>

            <th>
                Vai trò
            </th>

            <th>
                Mã NV
            </th>

            <th>
                Trạng thái
            </th>

            <th width="170">
                Hành động
            </th>

        </tr>

        </thead>

        <tbody>

        <tr th:each="t : ${danhSach}">

            <td th:text="${t.tenDangNhap}"></td>

            <td>
                ********
            </td>

            <td th:text="${t.vaiTro}"></td>

            <td th:text="${t.maNV}"></td>

            <td>

                <span th:if="${t.trangThai == 'Hoạt động'}"
                      class="badge bg-success">

                    Hoạt động

                </span>

                <span th:if="${t.trangThai == 'Bị khoá'}"
                      class="badge bg-danger">

                    Bị khoá

                </span>

            </td>

            <td>

                <a th:href="@{/tai-khoan/sua/{ma}(ma=${t.tenDangNhap})}"
                   class="btn btn-warning btn-sm">

                    Sửa

                </a>

                <a th:href="@{/tai-khoan/xoa/{ma}(ma=${t.tenDangNhap})}"
                   class="btn btn-danger btn-sm"
                   onclick="return confirm('Xác nhận xoá tài khoản này?')">

                    Xoá

                </a>

            </td>

        </tr>

        </tbody>

    </table>

</div>

</body>

</html>
