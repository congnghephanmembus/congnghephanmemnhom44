<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Danh sách tài khoản</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
</head>
<body>

<div class="container mt-4">

    <h2 class="mb-3">Danh sách tài khoản</h2>

    <a href="/" class="btn btn-secondary mb-3">Trang chủ</a>
    <a href="/taikhoan/them" class="btn btn-success mb-3">+ Thêm tài khoản mới</a>

    <table class="table table-bordered table-hover">
        <thead class="table-dark">
        <tr>
            <th>Tên đăng nhập</th>
            <th>Mật khẩu</th>
            <th>Vai trò</th>
            <th>Mã NV</th>
            <th>Trạng thái</th>
            <th>Hành động</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="t : ${danhSach}">
            <td th:text="${t.tenDangNhap}"></td>
            <td th:text="${t.matKhau}"></td>
            <td th:text="${t.vaiTro}"></td>
            <td th:text="${t.maNV}"></td>
            <td th:text="${t.trangThai}"></td>

            <td>
                <a th:href="@{/taikhoan/sua/{ma}(ma=${t.tenDangNhap})}"
                   class="btn btn-warning btn-sm">
                    Sửa
                </a>

                <a th:href="@{/taikhoan/xoa/{ma}(ma=${t.tenDangNhap})}"
                   class="btn btn-danger btn-sm"
                   onclick="return confirm('Xác nhận xoá tài khoản này?')">
                    Xoá
                </a>
            </td>
        </tr>
        </tbody>
    </table>

</div>

</body>
</html>
