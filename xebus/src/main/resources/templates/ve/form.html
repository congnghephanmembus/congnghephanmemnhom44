<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Cập nhật vé</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>

    <style>
        body{
            background:#f4f7f6;
        }

        .card{
            border:none;
            border-radius:15px;
            box-shadow:0 10px 25px rgba(0,0,0,.1);
        }
    </style>
</head>

<body>

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-7">

            <div class="card p-4">

                <h3 class="text-center text-primary mb-4">
                    <i class="fa-solid fa-ticket"></i>
                    Thông tin vé
                </h3>

                <form
                        id="veForm"
                        hx-post="/ve/luu"
                        hx-target="#main-display"
                        hx-swap="innerHTML"
                        th:object="${ve}">

                    <!-- CSRF Token -->
                    <input type="hidden"
                           th:name="${_csrf.parameterName}"
                           th:value="${_csrf.token}" />

                    <!-- Mã vé -->
                    <div class="form-floating mb-3">
                        <input
                                type="text"
                                class="form-control"
                                id="maVe"
                                name="maVe"
                                placeholder="Mã vé"
                                th:value="${ve.maVe}"
                                readonly
                                required>
                        <label for="maVe">Mã vé</label>
                    </div>

                    <!-- LOẠI KHÁCH HÀNG -->
                    <div class="form-floating mb-3">
                        <select
                                class="form-select"
                                id="loaiKhach"
                                name="loaiKhach"
                                onchange="onLoaiKhachChange()"
                                required>
                            <option value="">-- Chọn loại khách --</option>
                            <option value="VANG_LAI" th:selected="${loaiKhach == 'VANG_LAI'}">Vãng lai</option>
                            <option value="HSSV" th:selected="${loaiKhach == 'HSSV'}">Học sinh - Sinh viên</option>
                            <option value="VE_TAP" th:selected="${loaiKhach == 'VE_TAP'}">Vé tập 30 vé</option>
                        </select>
                        <label for="loaiKhach">Loại khách hàng</label>
                    </div>

                    <!-- Khách hàng -->
                    <div class="form-floating mb-3">
                        <select
                                class="form-select"
                                id="maKH"
                                name="maKH">
                            <option value="">-- Chọn khách hàng --</option>
                            <option th:each="kh : ${danhSachKhachHang}"
                                    th:value="${kh.maKH}"
                                    th:text="${kh.hoTen + ' - ' + kh.soDienThoai}"
                                    th:selected="${kh.maKH == ve.maKH}">
                            </option>
                        </select>
                        <label for="maKH">Khách hàng</label>
                    </div>

                    <!-- Loại vé - HIỂN THỊ (CHO VÃNG LAI) -->
                    <div id="vangLaiLoaiVeGroup" class="form-floating mb-3" style="display:none;">
                        <input
                                type="text"
                                class="form-control"
                                id="tenLoaiVeDisplay"
                                placeholder="Loại vé"
                                th:value="${tenLoaiVeDisplay}"
                                readonly>
                        <label for="tenLoaiVeDisplay">Loại vé</label>
                        <small class="text-muted">Tự động chọn theo cự ly tuyến</small>
                    </div>

                    <!-- Loại vé - DROPDOWN (CHO HSSV VÀ VÉ TẬP) -->
                    <!-- KHÔNG CÓ name="maLoaiVe" - CHỈ ĐỂ HIỂN THỊ -->
                    <div id="loaiVeGroup" class="form-floating mb-3" style="display:none;">
                        <select
                                class="form-select"
                                id="maLoaiVeSelect"
                                onchange="onLoaiVeSelectChange()">
                            <option value="">-- Chọn loại vé --</option>
                            <option th:each="lv : ${danhSachLoaiVe}"
                                    th:value="${lv.maLoaiVe}"
                                    th:text="${lv.maLoaiVe + ' - ' + lv.tenLoaiVe + ' (Giá: ' + lv.donGia + 'đ)'}"
                                    th:selected="${lv.maLoaiVe == ve.maLoaiVe}">
                            </option>
                        </select>
                        <label for="maLoaiVeSelect">Loại vé</label>
                    </div>

                    <!-- Hidden field để lưu maLoaiVe - CHỈ CÓ 1 TRƯỜNG DUY NHẤT name="maLoaiVe" -->
                    <input type="hidden" id="maLoaiVeHidden" name="maLoaiVe" value="" />

                    <!-- Tuyến -->
                    <div id="tuyenGroup" class="form-floating mb-3">
                        <select
                                class="form-select"
                                id="maTuyen"
                                name="maTuyen"
                                onchange="onTuyenChange()">
                            <option value="">-- Chọn tuyến --</option>
                            <option th:each="t : ${danhSachTuyen}"
                                    th:value="${t.maTuyen}"
                                    th:text="${t.maTuyen + ' - ' + t.tenTuyen}"
                                    th:selected="${t.maTuyen == ve.maTuyen}">
                            </option>
                        </select>
                        <label for="maTuyen">Tuyến</label>
                    </div>

                    <!-- Ngày mua -->
                    <div class="form-floating mb-4">
                        <input
                                type="date"
                                class="form-control"
                                id="ngayMua"
                                name="ngayMua"
                                placeholder="Ngày mua"
                                th:value="${#temporals.format(ve.ngayMua, 'yyyy-MM-dd')}"
                                required>
                        <label for="ngayMua">Ngày mua</label>
                    </div>

                    <!-- Button -->
                    <div class="d-flex justify-content-end gap-2">
                        <a
                                hx-get="/ve"
                                hx-target="#main-display"
                                hx-swap="innerHTML"
                                class="btn btn-outline-secondary">
                            Huỷ
                        </a>
                        <button type="submit" class="btn btn-primary">
                            <i class="fa-solid fa-save"></i>
                            Lưu
                        </button>
                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

<!-- JavaScript -->
<script>
    // =============================================
    // DỮ LIỆU TỪ SERVER
    // =============================================
    var danhSachLoaiVe = /*[[${danhSachLoaiVe}]]*/ [];
    var danhSachTuyen = /*[[${danhSachTuyen}]]*/ [];

    // =============================================
    // HÀM TÌM LOẠI VÉ THEO MÃ
    // =============================================
    function timLoaiVeTheoMa(ma) {
        for (var i = 0; i < danhSachLoaiVe.length; i++) {
            if (danhSachLoaiVe[i].maLoaiVe === ma) {
                return danhSachLoaiVe[i];
            }
        }
        return null;
    }

    // =============================================
    // HÀM SET LOẠI VÉ (CHO VÃNG LAI - TỰ ĐỘNG)
    // =============================================
    function setLoaiVeVangLai(maLoaiVe, tenLoaiVe, donGia) {
        var hidden = document.getElementById('maLoaiVeHidden');
        var display = document.getElementById('tenLoaiVeDisplay');

        if (maLoaiVe && tenLoaiVe) {
            hidden.value = maLoaiVe;
            display.value = maLoaiVe + ' - ' + tenLoaiVe + ' (Giá: ' + donGia + 'đ)';
            console.log('===== DA SET LOAI VE VANG LAI: ' + maLoaiVe);
            return true;
        }

        hidden.value = '';
        display.value = '';
        return false;
    }

    // =============================================
    // HÀM GỌI API LẤY LOẠI VÉ THEO TUYẾN
    // =============================================
    function layLoaiVeTheoTuyen(maTuyen) {
        console.log('===== layLoaiVeTheoTuyen() - maTuyen:', maTuyen);

        if (!maTuyen) {
            setLoaiVeVangLai(null);
            return;
        }

        fetch('/ve/lay-loai-ve?maTuyen=' + encodeURIComponent(maTuyen))
            .then(response => response.json())
            .then(data => {
                console.log('===== API response:', data);
                if (data.success) {
                    setLoaiVeVangLai(data.maLoaiVe, data.tenLoaiVe, data.donGia);
                } else {
                    setLoaiVeVangLai(null);
                    console.log('===== API error:', data.message);
                }
            })
            .catch(error => {
                console.error('===== API error:', error);
                setLoaiVeVangLai(null);
            });
    }

    // =============================================
    // HÀM KHI ĐỔI LOẠI KHÁCH
    // =============================================
    function onLoaiKhachChange() {
        var loaiKhach = document.getElementById('loaiKhach').value;
        var tuyenGroup = document.getElementById('tuyenGroup');
        var vangLaiLoaiVeGroup = document.getElementById('vangLaiLoaiVeGroup');
        var loaiVeGroup = document.getElementById('loaiVeGroup');
        var maTuyen = document.getElementById('maTuyen');
        var maKH = document.getElementById('maKH');
        var maLoaiVeSelect = document.getElementById('maLoaiVeSelect');
        var hidden = document.getElementById('maLoaiVeHidden');

        console.log('===== onLoaiKhachChange() - loaiKhach:', loaiKhach);

        // Reset
        hidden.value = '';
        vangLaiLoaiVeGroup.style.display = 'none';
        loaiVeGroup.style.display = 'none';

        if (loaiKhach === 'VANG_LAI') {
            tuyenGroup.style.display = 'block';
            maTuyen.required = true;
            maKH.required = false;
            vangLaiLoaiVeGroup.style.display = 'block';

            if (maTuyen.value) {
                layLoaiVeTheoTuyen(maTuyen.value);
            }

        } else if (loaiKhach === 'HSSV') {
            tuyenGroup.style.display = 'none';
            maTuyen.required = false;
            maTuyen.value = '';
            maKH.required = true;
            loaiVeGroup.style.display = 'block';

            // Lọc chỉ hiển thị VL04
            var options = maLoaiVeSelect.options;
            for (var i = 0; i < options.length; i++) {
                var opt = options[i];
                if (opt.value === 'VL04') {
                    opt.style.display = '';
                } else {
                    opt.style.display = 'none';
                }
            }
            maLoaiVeSelect.value = 'VL04';
            hidden.value = 'VL04';

        } else if (loaiKhach === 'VE_TAP') {
            tuyenGroup.style.display = 'none';
            maTuyen.required = false;
            maTuyen.value = '';
            maKH.required = true;
            loaiVeGroup.style.display = 'block';

            // Lọc chỉ hiển thị VT01
            var options = maLoaiVeSelect.options;
            for (var i = 0; i < options.length; i++) {
                var opt = options[i];
                if (opt.value === 'VT01') {
                    opt.style.display = '';
                } else {
                    opt.style.display = 'none';
                }
            }
            maLoaiVeSelect.value = 'VT01';
            hidden.value = 'VT01';

        } else {
            tuyenGroup.style.display = 'block';
            maTuyen.required = true;
            maKH.required = false;
        }
    }

    // =============================================
    // HÀM KHI ĐỔI LOẠI VÉ (CHO HSSV VÀ VÉ TẬP)
    // =============================================
    function onLoaiVeSelectChange() {
        var select = document.getElementById('maLoaiVeSelect');
        var hidden = document.getElementById('maLoaiVeHidden');
        hidden.value = select.value;
        console.log('===== onLoaiVeSelectChange() - maLoaiVe:', select.value);
    }

    // =============================================
    // HÀM KHI ĐỔI TUYẾN
    // =============================================
    function onTuyenChange() {
        var loaiKhach = document.getElementById('loaiKhach').value;
        var maTuyen = document.getElementById('maTuyen').value;

        console.log('===== onTuyenChange() - loaiKhach:', loaiKhach);
        console.log('===== onTuyenChange() - maTuyen:', maTuyen);

        if (loaiKhach !== 'VANG_LAI') {
            return;
        }

        layLoaiVeTheoTuyen(maTuyen);
    }

    // =============================================
    // KIỂM TRA TRƯỚC KHI SUBMIT
    // =============================================
    document.getElementById('veForm').addEventListener('submit', function(e) {
        var maLoaiVe = document.getElementById('maLoaiVeHidden').value;
        var loaiKhach = document.getElementById('loaiKhach').value;

        console.log('===== SUBMIT - maLoaiVe:', maLoaiVe);

        if (!maLoaiVe) {
            alert('Vui lòng chọn loại vé!');
            e.preventDefault();
            return false;
        }

        if ((loaiKhach === 'HSSV' || loaiKhach === 'VE_TAP')) {
            var maKH = document.getElementById('maKH').value;
            if (!maKH) {
                alert('Vui lòng chọn khách hàng!');
                e.preventDefault();
                return false;
            }
        }

        return true;
    });

    // =============================================
    // KHỞI TẠO KHI TRANG LOAD
    // =============================================
    document.addEventListener('DOMContentLoaded', function() {
        console.log('===== DOMContentLoaded');

        var loaiKhach = document.getElementById('loaiKhach').value;
        var maTuyen = document.getElementById('maTuyen').value;

        onLoaiKhachChange();

        if (loaiKhach === 'VANG_LAI' && maTuyen) {
            layLoaiVeTheoTuyen(maTuyen);
        }
    });
</script>

</body>
</html>
