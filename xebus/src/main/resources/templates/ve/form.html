<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Form vé</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
</head>
<body>

<div class="container mt-4">

    <h2>Thông tin vé</h2>

    <form th:action="@{/ve/luu}" th:object="${ve}" method="post">

        <div class="mb-3">
            <label class="form-label">Mã vé</label>
            <input type="text" th:field="*{maVe}" class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Mã khách hàng</label>
            <input type="text" th:field="*{maKH}" class="form-control">
        </div>

        <div class="mb-3">
            <label class="form-label">Mã loại vé</label>
            <input type="text" th:field="*{maLoaiVe}" class="form-control">
        </div>

        <div class="mb-3">
            <label class="form-label">Mã tuyến</label>
            <input type="text" th:field="*{maTuyen}" class="form-control">
        </div>

        <div class="mb-3">
            <label class="form-label">Ngày mua</label>
            <input type="datetime-local" th:field="*{ngayMua}" class="form-control">
        </div>

        <button type="submit" class="btn btn-primary">Lưu</button>
        <a href="/ve" class="btn btn-secondary">Quay lại</a>

    </form>

</div>

</body>
</html>
