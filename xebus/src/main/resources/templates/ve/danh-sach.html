<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Danh sách vé</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
</head>
<body>

<div class="container mt-4">

    <h2>Danh sách vé</h2>

    <a href="/" class="btn btn-secondary mb-3">Trang chủ</a>
    <a href="/ve/them" class="btn btn-success mb-3">+ Thêm vé</a>

    <table class="table table-bordered table-hover">
        <thead class="table-dark">
        <tr>
            <th>Mã vé</th>
            <th>Mã khách hàng</th>
            <th>Mã loại vé</th>
            <th>Mã tuyến</th>
            <th>Ngày mua</th>
            <th>Hành động</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="v : ${danhSach}">
            <td th:text="${v.maVe}"></td>
            <td th:text="${v.maKH}"></td>
            <td th:text="${v.maLoaiVe}"></td>
            <td th:text="${v.maTuyen}"></td>
            <td th:text="${v.ngayMua}"></td>
            <td>
                <a th:href="@{/ve/sua/{ma}(ma=${v.maVe})}"
                   class="btn btn-warning btn-sm">Sửa</a>

                <a th:href="@{/ve/xoa/{ma}(ma=${v.maVe})}"
                   class="btn btn-danger btn-sm"
                   onclick="return confirm('Xác nhận xoá vé?')">Xoá</a>
            </td>
        </tr>
        </tbody>
    </table>

</div>

</body>
</html>
