<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Form khách hàng</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
</head>
<body>

<div class="container mt-4">

    <h2>Thông tin khách hàng</h2>

    <form th:action="@{/khach-hang/luu}" th:object="${khachHang}" method="post">

        <div class="mb-3">
            <label class="form-label">Mã khách hàng</label>
            <input type="text" th:field="*{maKH}" class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Họ tên</label>
            <input type="text" th:field="*{hoTen}" class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Số điện thoại</label>
            <input type="text" th:field="*{soDienThoai}" class="form-control">
        </div>

        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" th:field="*{email}" class="form-control">
        </div>

        <div class="mb-3">
            <label class="form-label">Địa chỉ</label>
            <input type="text" th:field="*{diaChi}" class="form-control">
        </div>

        <button type="submit" class="btn btn-primary">Lưu</button>
        <a href="/khach-hang" class="btn btn-secondary">Quay lại</a>

    </form>

</div>

</body>
</html>
