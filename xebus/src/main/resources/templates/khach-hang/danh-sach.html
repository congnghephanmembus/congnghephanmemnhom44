<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Danh sách khách hàng</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
</head>
<body>

<div class="container mt-4">

    <h2>Danh sách khách hàng</h2>

    <a href="/" class="btn btn-secondary mb-3">Trang chủ</a>
    <a href="/khach-hang/them" class="btn btn-success mb-3">+ Thêm khách hàng</a>

    <table class="table table-bordered table-hover">
        <thead class="table-dark">
        <tr>
            <th>Mã KH</th>
            <th>Họ tên</th>
            <th>Số điện thoại</th>
            <th>Email</th>
            <th>Địa chỉ</th>
            <th>Hành động</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="kh : ${danhSach}">
            <td th:text="${kh.maKH}"></td>
            <td th:text="${kh.hoTen}"></td>
            <td th:text="${kh.soDienThoai}"></td>
            <td th:text="${kh.email}"></td>
            <td th:text="${kh.diaChi}"></td>
            <td>
                <a th:href="@{/khach-hang/sua/{ma}(ma=${kh.maKH})}"
                   class="btn btn-warning btn-sm">Sửa</a>

                <a th:href="@{/khach-hang/xoa/{ma}(ma=${kh.maKH})}"
                   class="btn btn-danger btn-sm"
                   onclick="return confirm('Xác nhận xoá khách hàng?')">Xoá</a>
            </td>
        </tr>
        </tbody>
    </table>

</div>

</body>
</html>
