<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <title>Danh sách khách hàng</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>

    <style>
        body {
            background-color: #f4f7f6;
        }

        .card {
            border: none;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .table thead {
            background-color: #343a40;
            color: white;
        }

        .btn-sm {
            padding: 0.25rem 0.5rem;
            font-size: 0.8rem;
        }
    </style>
</head>

<body>

<div class="container mt-5">
    <div class="card p-4">

        <div class="d-flex justify-content-between align-items-center mb-4">

            <h2 class="fw-bold text-primary">
                <i class="fa-solid fa-users"></i>
                Quản lý Khách hàng
            </h2>

            <div>

                <a href="/" class="btn btn-outline-secondary">
                    <i class="fa-solid fa-house"></i>
                    Trang chủ
                </a>

                <a sec:authorize="hasAnyRole('ROLE_QuanTriVien', 'ROLE_NhanVienBanVe')"
                   hx-get="/khach-hang/them"
                   hx-target="#main-display"
                   hx-swap="innerHTML"
                   class="btn btn-success ms-2">

                    <i class="fa-solid fa-plus"></i>
                    Thêm mới

                </a>

            </div>

        </div>

        <div class="table-responsive">

            <table class="table table-hover align-middle">

                <thead class="table-dark">

                <tr>
                    <th>Mã KH</th>
                    <th>Họ tên</th>
                    <th>Số điện thoại</th>
                    <th>Email</th>
                    <th>Địa chỉ</th>
                    <th class="text-center">Hành động</th>
                </tr>

                </thead>

                <tbody>

                <tr th:each="kh : ${danhSach}">

                    <td class="fw-bold" th:text="${kh.maKH}"></td>

                    <td>
                        <i class="fa-solid fa-user text-muted me-2"></i>
                        <span th:text="${kh.hoTen}"></span>
                    </td>

                    <td>
                        <i class="fa-solid fa-phone text-muted me-2"></i>
                        <span th:text="${kh.soDienThoai}"></span>
                    </td>

                    <td>
                        <i class="fa-solid fa-envelope text-muted me-2"></i>
                        <span th:text="${kh.email}"></span>
                    </td>

                    <td th:text="${kh.diaChi}"></td>

                    <td class="text-center">

                        <!-- Sửa -->
                        <a sec:authorize="hasAnyRole('ROLE_QuanTriVien', 'ROLE_NhanVienBanVe')"
                           th:attr="hx-get=@{/khach-hang/sua/{ma}(ma=${kh.maKH})}"
                           hx-target="#main-display"
                           hx-swap="innerHTML"
                           class="btn btn-outline-warning btn-sm">

                            <i class="fa-solid fa-pen"></i>

                        </a>

                        <!-- Xóa -->
                        <a sec:authorize="hasRole('ROLE_QuanTriVien')"
                           th:attr="hx-get=@{/khach-hang/xoa/{ma}(ma=${kh.maKH})}"
                           hx-target="#main-display"
                           hx-swap="innerHTML"
                           onclick="return confirm('Xác nhận xoá khách hàng này?')"
                           class="btn btn-outline-danger btn-sm">

                            <i class="fa-solid fa-trash"></i>

                        </a>

                    </td>

                </tr>

                </tbody>

            </table>

        </div>

    </div>
</div>

</body>
</html>
