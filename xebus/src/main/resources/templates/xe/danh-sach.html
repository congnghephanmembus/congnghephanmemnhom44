<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Quản lý xe buýt</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
    <style>
        body { background-color: #f8f9fa; }
        .card { border-radius: 12px; border: none; box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075); }
        .table thead { background-color: #34495e; color: white; }
    </style>
</head>
<body>

<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="text-primary fw-bold"><i class="fa fa-bus"></i> Quản lý xe buýt</h2>
        <a href="/" class="btn btn-outline-secondary"><i class="fa fa-home"></i> Trang chủ</a>
    </div>

    <div class="card p-4">
        <div class="mb-3">
            <a sec:authorize="hasAnyRole('ROLE_QuanLy','ROLE_QuanTriVien')"
               href="/xe/them" class="btn btn-success">
                <i class="fa fa-plus-circle"></i> Thêm xe buýt mới
            </a>
        </div>

        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead class="table-dark">
                    <tr>
                        <th>Mã xe</th>
                        <th>Biển số</th>
                        <th>Sức chứa</th>
                        <th>Loại xe</th>
                        <th>Trạng thái</th>
                        <th class="text-center">Hành động</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="x : ${danhSach}">
                        <td class="fw-bold" th:text="${x.maXe}"></td>
                        <td th:text="${x.bienSo}"></td>
                        <td><i class="fa fa-user-friends me-1"></i><span th:text="${x.sucChua}"></span></td>
                        <td th:text="${x.loaiXe}"></td>
                        <td>
                            <span th:classappend="${x.trangThai == 'Hoạt động' ? 'bg-success' : 'bg-warning'}" 
                                  class="badge" th:text="${x.trangThai}"></span>
                        </td>
                        <td class="text-center">
                            <a sec:authorize="hasAnyRole('ROLE_QuanLy','ROLE_QuanTriVien')"
                               th:href="@{/xe/sua/{ma}(ma=${x.maXe})}"
                               class="btn btn-sm btn-outline-warning me-2">
                                <i class="fa fa-edit"></i> Sửa
                            </a>
                            <a sec:authorize="hasRole('ROLE_QuanTriVien')"
                               th:href="@{/xe/xoa/{ma}(ma=${x.maXe})}"
                               class="btn btn-sm btn-outline-danger"
                               onclick="return confirm('Xác nhận xoá xe này?')">
                                <i class="fa fa-trash"></i> Xoá
                            </a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

</body>
</html>
