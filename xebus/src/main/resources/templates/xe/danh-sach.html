<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <title>Quản lý xe buýt</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
</head>

<body>

<div class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-3">

        <h2 class="mb-0">Quản lý xe buýt</h2>

        <a href="/" class="btn btn-secondary">
            Trang chủ
        </a>

    </div>

    <!-- Admin + Manager -->
    <a sec:authorize="hasAnyRole('ROLE_QuanLy','ROLE_QuanTriVien')"
       href="/xe/them"
       class="btn btn-success mb-3">

        + Thêm xe buýt

    </a>

    <table class="table table-bordered table-hover align-middle">

        <thead class="table-dark">

        <tr>
            <th>Mã xe</th>
            <th>Biển số</th>
            <th>Sức chứa</th>
            <th>Loại xe</th>
            <th>Trạng thái</th>
            <th width="220">Hành động</th>
        </tr>

        </thead>

        <tbody>

        <tr th:each="x : ${danhSach}">

            <td th:text="${x.maXe}"></td>

            <td th:text="${x.bienSo}"></td>

            <td th:text="${x.sucChua}"></td>

            <td th:text="${x.loaiXe}"></td>

            <td th:text="${x.trangThai}"></td>

            <td>

                <!-- Admin + Manager -->
                <a sec:authorize="hasAnyRole('ROLE_QuanLy','ROLE_QuanTriVien')"
                   th:href="@{/xe/sua/{ma}(ma=${x.maXe})}"
                   class="btn btn-warning btn-sm">

                    Sửa

                </a>

                <!-- Admin only -->
                <a sec:authorize="hasRole('ROLE_QuanTriVien')"
                   th:href="@{/xe/xoa/{ma}(ma=${x.maXe})}"
                   class="btn btn-danger btn-sm"
                   onclick="return confirm('Xác nhận xoá xe này?')">

                    Xoá

                </a>

            </td>

        </tr>

        </tbody>

    </table>

</div>

</body>
</html>
