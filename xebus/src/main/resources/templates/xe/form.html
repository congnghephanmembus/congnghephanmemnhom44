<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Thông tin xe buýt</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
    <style>
        body { background-color: #f8f9fa; }
        .form-card { border-radius: 15px; border: none; box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        .form-label { font-weight: 600; color: #495057; }
    </style>
</head>
<body>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card form-card p-4">
                <h3 class="mb-4 text-center text-primary"><i class="fa fa-edit"></i> Thông tin xe buýt</h3>
                
                <form th:action="@{/xe/luu}" th:object="${xe}" method="post">
                    <div class="mb-3">
                        <label class="form-label"><i class="fa fa-id-badge"></i> Mã xe</label>
                        <input type="text" th:field="*{maXe}" class="form-control" placeholder="Ví dụ: BUS001" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label"><i class="fa fa-car"></i> Biển số</label>
                        <input type="text" th:field="*{bienSo}" class="form-control" placeholder="Ví dụ: 51B-123.45" required>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label"><i class="fa fa-users"></i> Sức chứa</label>
                            <input type="number" th:field="*{sucChua}" class="form-control" placeholder="Số ghế">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label"><i class="fa fa-bus"></i> Loại xe</label>
                            <input type="text" th:field="*{loaiXe}" class="form-control" placeholder="Loại xe">
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label"><i class="fa fa-info-circle"></i> Trạng thái</label>
                        <select th:field="*{trangThai}" class="form-select">
                            <option value="Hoạt động">Hoạt động</option>
                            <option value="Bảo trì">Bảo trì</option>
                            <option value="Ngưng sử dụng">Ngưng sử dụng</option>
                        </select>
                    </div>

                    <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                        <a href="/xe" class="btn btn-outline-secondary me-md-2"><i class="fa fa-arrow-left"></i> Quay lại</a>
                        <button type="submit" class="btn btn-primary px-4"><i class="fa fa-save"></i> Lưu thông tin</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

</body>
</html>
