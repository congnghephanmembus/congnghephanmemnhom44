<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Cập nhật xe buýt</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>

    <style>
        body{
            background:#f4f7f6;
        }

        .card{
            border:none;
            border-radius:15px;
            box-shadow:0 10px 25px rgba(0,0,0,.1);
        }
    </style>
</head>

<body>

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-7">

            <div class="card p-4">

                <h3 class="text-center text-primary mb-4">
                    <i class="fa-solid fa-bus"></i>
                    Thông tin xe buýt
                </h3>

                <form
                        hx-post="/xe/luu"
                        hx-target="#main-display"
                        hx-swap="innerHTML"
                        th:object="${xe}">

                    <!-- CSRF Token -->
                    <input type="hidden"
                           th:name="${_csrf.parameterName}"
                           th:value="${_csrf.token}" />

                    <!-- Mã xe - READONLY (tự động sinh) -->
                    <div class="form-floating mb-3">
                        <input
                                type="text"
                                class="form-control"
                                id="maXe"
                                name="maXe"
                                placeholder="Mã xe"
                                th:value="${xe.maXe}"
                                readonly
                                required>
                        <label for="maXe">Mã xe</label>
                    </div>

                    <!-- Biển số -->
                    <div class="form-floating mb-3">
                        <input
                                type="text"
                                class="form-control"
                                id="bienSo"
                                name="bienSo"
                                placeholder="Biển số"
                                th:value="${xe.bienSo}"
                                required>
                        <label for="bienSo">Biển số</label>
                    </div>

                    <!-- Sức chứa -->
                    <div class="form-floating mb-3">
                        <input
                                type="number"
                                min="1"
                                class="form-control"
                                id="sucChua"
                                name="sucChua"
                                placeholder="Sức chứa"
                                th:value="${xe.sucChua}">
                        <label for="sucChua">Sức chứa</label>
                    </div>

                    <!-- Loại xe -->
                    <div class="form-floating mb-3">
                        <input
                                type="text"
                                class="form-control"
                                id="loaiXe"
                                name="loaiXe"
                                placeholder="Loại xe"
                                th:value="${xe.loaiXe}">
                        <label for="loaiXe">Loại xe</label>
                    </div>

                    <!-- Trạng thái -->
                    <div class="form-floating mb-4">
                        <select
                                class="form-select"
                                id="trangThai"
                                name="trangThai">
                            <option value="Hoạt động" th:selected="${xe.trangThai == 'Hoạt động'}">Hoạt động</option>
                            <option value="Bảo trì" th:selected="${xe.trangThai == 'Bảo trì'}">Bảo trì</option>
                            <option value="Ngưng sử dụng" th:selected="${xe.trangThai == 'Ngưng sử dụng'}">Ngưng sử dụng</option>
                        </select>
                        <label for="trangThai">Trạng thái</label>
                    </div>

                    <!-- Button -->
                    <div class="d-flex justify-content-end gap-2">
                        <a
                                hx-get="/xe"
                                hx-target="#main-display"
                                hx-swap="innerHTML"
                                class="btn btn-outline-secondary">
                            Huỷ
                        </a>
                        <button type="submit" class="btn btn-primary">
                            <i class="fa-solid fa-save"></i>
                            Lưu
                        </button>
                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

</body>
</html>
