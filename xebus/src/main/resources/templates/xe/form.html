<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Thông tin xe buýt</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
</head>

<body>

<div class="container mt-4">

    <h2 class="mb-4">Thông tin xe buýt</h2>

    <form th:action="@{/xe/luu}"
          th:object="${xe}"
          method="post">

        <div class="mb-3">

            <label class="form-label">Mã xe</label>

            <input type="text"
                   th:field="*{maXe}"
                   class="form-control"
                   required>

        </div>

        <div class="mb-3">

            <label class="form-label">Biển số</label>

            <input type="text"
                   th:field="*{bienSo}"
                   class="form-control"
                   required>

        </div>

        <div class="mb-3">

            <label class="form-label">Sức chứa</label>

            <input type="number"
                   th:field="*{sucChua}"
                   class="form-control">

        </div>

        <div class="mb-3">

            <label class="form-label">Loại xe</label>

            <input type="text"
                   th:field="*{loaiXe}"
                   class="form-control">

        </div>

        <div class="mb-3">

            <label class="form-label">Trạng thái</label>

            <input type="text"
                   th:field="*{trangThai}"
                   class="form-control">

        </div>

        <button type="submit"
                class="btn btn-primary">

            Lưu

        </button>

        <a href="/xe"
           class="btn btn-secondary">

            Quay lại

        </a>

    </form>

</div>

</body>
</html>
